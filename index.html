<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Events tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f2; --panel:#ffffff; --panel-2:#f6f7f9; --ink:#1b232b; --ink-2:#5a6670; --line:#d7dce1;
  --accent:#1f4e79; --accent-ink:#ffffff; --accent-soft:#e8eef5;
  --ok:#2d8a4e; --warn:#c7781b; --danger:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14191e; --panel:#1c2329; --panel-2:#232b32; --ink:#e3e8ec; --ink-2:#97a3ad; --line:#323c45;
    --accent:#7fb0e0; --accent-ink:#0f1a24; --accent-soft:#22313f;
    --ok:#5cbf7d; --warn:#e3a14f; --danger:#ef7a72; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* header */
header{display:flex;align-items:center;gap:12px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{margin:0 8px 0 0;font-size:16px;font-weight:600;white-space:nowrap}
nav.tabs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px}
nav.tabs a{padding:5px 12px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
header .spacer{flex:1}
#savestate{font-size:13px;color:var(--ink-2);text-align:right}
#savestate.err{color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
#unitbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}

/* layout */
main{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 54px)}
main.full{grid-template-columns:1fr}
#list{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;position:sticky;top:var(--hh,54px);align-self:start;height:calc(100vh - var(--hh,54px))}
#detail{padding:26px 32px 60px;max-width:940px;min-width:0}
main.full #list{display:none}
main.full #detail{max-width:1100px}

/* list */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.filters input[type=search]{grid-column:1/-1}
.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);min-width:0}
.filters label{grid-column:1/-1;font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:0 14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:4px solid transparent;border-top:0;border-right:0}
.row:hover{background:var(--panel-2)}
.row.active{background:var(--accent-soft);border-left-color:var(--accent)}
.row.past{opacity:.55}
.row .d{font-size:21px;font-weight:600;line-height:1}
.row .d small{display:block;font-size:11px;font-weight:500;color:var(--ink-2);margin-top:3px}
.row .n{font-weight:500}
.row .m{font-size:13px;color:var(--ink-2)}
.row .st{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--ink-2)}
.row.client{grid-template-columns:1fr auto}
.bar{width:64px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px;background:var(--ink-2)}
.qbadge{color:var(--warn);font-weight:500}
.listfoot{padding:14px 16px;font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px}

/* detail */
.empty{color:var(--ink-2);padding-top:40px;max-width:460px}
.empty h2{font-weight:600;margin:0 0 8px;color:var(--ink)}
.title{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.title input.name{flex:1;font-size:26px;font-weight:600;border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;min-width:0}
.title input.name:hover,.title input.name:focus{border-bottom-color:var(--line);outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px;margin-bottom:8px}
.grid .wide{grid-column:1/-1}
label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.fld input,.fld select,.fld textarea,input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--panel);min-width:0}
textarea{resize:vertical;min-height:62px;line-height:1.4}
h3{font-size:13px;font-weight:600;color:var(--ink-2);margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
h3 .sp{flex:1}
h3 .btn{font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.inline{display:flex;gap:8px;align-items:center}
.inline > input,.inline > select{flex:1}
.hint{font-size:13px;color:var(--ink-2)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-weight:500;color:var(--ink-2);font-size:12px}
table.t .num{text-align:right;white-space:nowrap}
table.t td input,table.t td select{width:100%;border:1px solid transparent;border-radius:5px;padding:5px 6px;background:none;min-width:0}
table.t td input:hover,table.t td input:focus,table.t td select:hover,table.t td select:focus{border-color:var(--line);background:var(--panel)}
table.t td.x{width:34px;text-align:right}
table.t tr.closed td{color:var(--ink-2)}
.tag{font-size:12px;padding:1px 7px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.open{color:var(--warn);border-color:currentColor;background:none}

.card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px 16px;margin-bottom:14px}
.cardhead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.cardhead input{flex:1;font-size:17px;font-weight:600;border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;min-width:0}
.cardhead input:hover,.cardhead input:focus{border-bottom-color:var(--line);outline:0}
.seq{counter-reset:s;margin:4px 0 12px}
.seq .srow{display:grid;grid-template-columns:24px 1fr 90px 34px;gap:6px;align-items:center;margin-bottom:5px}
.seq .srow::before{counter-increment:s;content:counter(s);font-size:12px;color:var(--ink-2);text-align:right}
.seq select,.seq input{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--panel);min-width:0}
.sub{font-size:12px;color:var(--ink-2);margin:12px 0 5px;font-weight:500}

.q{display:grid;grid-template-columns:38px 1fr auto;gap:8px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.q .qn{font-weight:600;color:var(--warn);padding-top:7px}
.q.resolved .qn{color:var(--ok)}
.q.resolved textarea[data-k=text]{color:var(--ink-2)}
.q textarea{min-height:38px}
.q .qa{grid-column:2}
.q .qc{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.q label{font-size:13px;display:flex;gap:5px;align-items:center;color:var(--ink-2);white-space:nowrap}

.check{list-style:none;margin:0;padding:0;columns:2;column-gap:28px}
.check li{break-inside:avoid;padding:4px 0}
.check label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.check input{margin:4px 0 0;width:15px;height:15px;flex:none}
.check .done{color:var(--ink-2);text-decoration:line-through}

.addrow{display:grid;grid-template-columns:150px 90px 1fr auto;gap:8px;margin-top:10px}
.addrow.wide{grid-template-columns:160px 1fr 140px 90px 1fr auto}
.addrow input,.addrow select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);min-width:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:12px;color:var(--ink-2)}
.closebox{display:grid;grid-template-columns:160px 1fr auto;gap:8px;align-items:end}
.foot{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);gap:10px}
.hoursbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.hoursbar select,.hoursbar input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel)}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:12px;padding:24px 26px;max-width:480px;width:calc(100% - 32px);color:var(--ink);background:var(--panel)}
dialog::backdrop{background:rgba(20,30,40,.45)}
dialog h2{margin:0 0 6px;font-size:18px}
dialog p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
dialog .fld{margin-bottom:12px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
.msg{font-size:14px;color:var(--danger);min-height:20px;margin-top:6px}
#sumdlg{max-width:900px;padding:0;background:var(--bg)}
#sumdlg .sumbar{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;flex-wrap:wrap}
#sumdlg .sumbar label{font-size:13px;color:var(--ink-2);display:flex;gap:5px;align-items:center;margin-right:auto}
#sumdlg .sumwrap{padding:16px;overflow-x:auto}

/* summary sheet: always light, fixed palette (exported as image) */
.sheet{width:800px;margin:0 auto;background:#fff;color:#1b232b;padding:36px 40px;font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.sheet h1{font-size:26px;margin:0 0 4px;font-weight:600}
.sheet .meta{color:#5a6670;margin-bottom:18px}
.sheet .pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;color:#fff;margin-right:8px;vertical-align:2px}
.sheet h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#5a6670;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid #d7dce1;font-weight:600}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{padding:5px 8px 5px 0;border-bottom:1px solid #eceff2;text-align:left;vertical-align:top}
.sheet th{font-size:11px;color:#5a6670;font-weight:500}
.sheet .route{font-size:13px;color:#5a6670}
.sheet .seqline{font-size:13px;margin:2px 0 8px}
.sheet .qs{margin:0;padding:0;list-style:none}
.sheet .qs li{display:grid;grid-template-columns:40px 1fr;padding:6px 0;border-bottom:1px solid #eceff2}
.sheet .qs b{color:#c7781b}
.sheet .qs.done b{color:#2d8a4e}
.sheet .qs .a{color:#5a6670;font-size:13px}
.sheet .prog{height:6px;background:#d7dce1;border-radius:3px;overflow:hidden;width:200px;display:inline-block;vertical-align:middle;margin-right:8px}
.sheet .prog i{display:block;height:100%;background:#2d8a4e}
.sheet .footer{margin-top:26px;font-size:12px;color:#8a949d;display:flex;justify-content:space-between}
#printarea{display:none}

@media (max-width:860px){
  header{padding-left:12px;padding-right:12px}
  header h1{display:none}
  main{grid-template-columns:1fr}
  #list{border-right:0;position:static;height:auto}
  #detail{padding:18px 16px 60px}
  body.showing-detail #list{display:none}
  body:not(.showing-detail) main:not(.full) #detail{display:none}
  .check{columns:1}
  .two{grid-template-columns:1fr}
  .addrow,.addrow.wide{grid-template-columns:1fr 1fr}
  .addrow .grow{grid-column:1/-1}
  .closebox{grid-template-columns:1fr 1fr}
  .q{grid-template-columns:32px 1fr}
  .q .qc{grid-column:2;flex-direction:row;justify-content:space-between}
  #back{display:inline-flex}
  table.t.resp thead{display:none}
  table.t.resp tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);padding:6px 0}
  table.t.resp td{border:0}
}
#back{display:none}
@media print{
  body.printing > *:not(#printarea){display:none!important}
  body.printing{background:#fff}
  body.printing #printarea{display:block}
  #printarea .sheet{width:auto;padding:0}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button id="back" class="btn sm" type="button">‹ Indietro</button>
  <h1>Events tracker</h1>
  <nav class="tabs" aria-label="Sezioni">
    <a href="#/e" data-view="e">Eventi</a>
    <a href="#/c" data-view="c">Clienti</a>
    <a href="#/h" data-view="h">Ore</a>
  </nav>
  <span class="spacer"></span>
  <span id="savestate" role="status"></span>
  <button id="unitbtn" class="btn sm" type="button" aria-pressed="false" title="Mostra / nascondi valori">🍦</button>
  <button id="newbtn" class="btn" type="button">+ Evento</button>
  <button id="setbtn" class="btn sm" type="button" title="Impostazioni" aria-label="Impostazioni">⚙</button>
</header>

<main id="main">
  <nav id="list" aria-label="Elenco"></nav>
  <section id="detail"></section>
</main>

<dialog id="settings">
  <h2>Collegamento al repository</h2>
  <p>I dati vivono nella cartella di un repo privato. Il token resta solo in questo browser.</p>
  <div class="fld"><label class="f" for="s-owner">Utente GitHub</label><input id="s-owner" autocapitalize="off" spellcheck="false"></div>
  <div class="fld"><label class="f" for="s-repo">Repository dati</label><input id="s-repo" autocapitalize="off" spellcheck="false"></div>
  <div class="fld"><label class="f" for="s-dir">Cartella</label><input id="s-dir" autocapitalize="off" spellcheck="false"></div>
  <div class="fld"><label class="f" for="s-token">Token (fine-grained, Contents: read &amp; write)</label><input id="s-token" type="password" autocapitalize="off" autocomplete="off"></div>
  <div class="msg" id="s-msg"></div>
  <div class="actions">
    <button class="btn danger" id="s-logout" type="button">Scollega</button>
    <span class="spacer" style="flex:1"></span>
    <button class="btn" id="s-cancel" type="button">Annulla</button>
    <button class="btn primary" id="s-save" type="button">Collega</button>
  </div>
</dialog>

<dialog id="sumdlg" aria-label="Riepilogo per il cliente">
  <div class="sumbar">
    <label><input type="checkbox" id="sum-resolved"> includi domande risolte</label>
    <button class="btn" id="sum-png" type="button">Scarica PNG</button>
    <button class="btn" id="sum-pdf" type="button">Stampa / PDF</button>
    <button class="btn primary" id="sum-close" type="button">Chiudi</button>
  </div>
  <div class="sumwrap"><div id="sumsheet"></div></div>
</dialog>
<div id="printarea"></div>

<script>
'use strict';
/* =====================================================================
   STORAGE — the only part that knows where data lives.
   GitHub contents API today; swap this object for Supabase later.
   ===================================================================== */
const CFG_KEY='events-tracker-cfg-v2';
const DEMO=new URLSearchParams(location.search).has('demo');
let cfg=Object.assign({owner:'',repo:'events-tracker-data',dir:'data',token:''},readLS(CFG_KEY));
function readLS(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}') }catch{ return {} } }
function saveCfg(){ try{ localStorage.setItem(CFG_KEY,JSON.stringify(cfg)) }catch{} }

const b64enc=s=>{ const b=new TextEncoder().encode(s); let o=''; for(let i=0;i<b.length;i+=0x8000) o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(o); };
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));

class ConflictError extends Error{}
const GitHubStore={
  sha:{},
  url(name=''){ return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.dir.replace(/^\/|\/$/g,'')}${name?'/'+name:''}`; },
  hdr(){ return {Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; },
  async list(){
    const r=await fetch(this.url(),{headers:this.hdr(),cache:'no-store'});
    if(r.status===404) return null;
    if(!r.ok) throw new Error(r.status===401?'Token non valido':`GitHub ${r.status}`);
    return (await r.json()).filter(f=>f.type==='file'&&f.name.endsWith('.json')).map(f=>f.name);
  },
  async get(name){
    const r=await fetch(this.url(name),{headers:this.hdr(),cache:'no-store'});
    if(r.status===404) return null;
    if(!r.ok) throw new Error(`GitHub ${r.status} su ${name}`);
    const j=await r.json(); this.sha[name]=j.sha; return b64dec(j.content);
  },
  async put(name,text){
    const body={message:`${name} · ${new Date().toISOString().slice(0,16).replace('T',' ')}`,content:b64enc(text)};
    if(this.sha[name]) body.sha=this.sha[name];
    const r=await fetch(this.url(name),{method:'PUT',headers:this.hdr(),body:JSON.stringify(body)});
    if(r.status===409||r.status===422) throw new ConflictError(name);
    if(!r.ok) throw new Error(`errore ${r.status}`);
    this.sha[name]=(await r.json()).content.sha;
  }
};
/* ?demo — reads ../data/ next to the site folder, never writes. For local testing only. */
const DemoStore={
  async list(){ return ['config.json','clients.json','hours.json','events-2026.json']; },
  async get(name){ const r=await fetch('../data/'+name,{cache:'no-store'}); return r.ok?r.text():null; },
  async put(){ await new Promise(r=>setTimeout(r,150)); }
};
const Store=DEMO?DemoStore:GitHubStore;

/* =====================================================================
   MODEL
   ===================================================================== */
const DEFAULT_CONFIG={version:2,unit:{label:'gelati',icon:'🍦'},
  statuses:[{name:'da preparare',color:'#8a949d'},{name:'in corso',color:'#3b6fb6'},{name:'in test',color:'#c7781b'},{name:'pronto',color:'#2d8a4e'},{name:'chiuso',color:'#1f4e79'}],
  eventTypes:['Trail','Corsa su strada','Ciclismo','Triathlon','Multi'],startTypes:['in linea','a onde','individuale'],checklistTemplate:[]};
let S=null;              // {config, clients[], events[], hours:{entries[],closures[]}}
let saved={};            // file name -> last saved text
let eventFiles=new Set();// events-YYYY.json files known in the repo

async function loadAll(){
  setState('caricamento…');
  const names=await Store.list();
  if(names===null) return 'missing';
  const txt={}; await Promise.all(names.map(async n=>{ txt[n]=await Store.get(n); }));
  const j=n=>txt[n]?JSON.parse(txt[n]):null;
  S={config:Object.assign({},DEFAULT_CONFIG,j('config.json')||{}),
     clients:(j('clients.json')||{}).clients||[],
     hours:Object.assign({entries:[],closures:[]},j('hours.json')||{}),
     events:[]};
  eventFiles=new Set(names.filter(n=>/^events-.+\.json$/.test(n)));
  for(const n of [...eventFiles]) S.events.push(...((j(n)||{}).events||[]));
  saved={}; for(const [n,t] of Object.entries(serialize())) if(txt[n]!=null) saved[n]=t; // unchanged files won't be rewritten
  for(const n of names) if(!(n in saved)&&txt[n]!=null) saved[n]=txt[n];
  setState(DEMO?'demo · non salva':'aggiornato');
  return 'ok';
}
const yearOf=e=>(e.dateStart||'').slice(0,4)||String(new Date().getFullYear());
function serialize(){
  const out={
    'config.json':JSON.stringify(S.config,null,2),
    'clients.json':JSON.stringify({version:2,clients:S.clients},null,2),
    'hours.json':JSON.stringify({version:2,entries:S.hours.entries,closures:S.hours.closures},null,2)};
  const by={}; for(const e of S.events)(by[yearOf(e)]=by[yearOf(e)]||[]).push(e);
  const files=new Set([...eventFiles,...Object.keys(by).map(y=>`events-${y}.json`)]);
  for(const f of files){ const y=f.slice(7,-5); const ev=(by[y]||[]).slice().sort((a,b)=>(a.dateStart||'9').localeCompare(b.dateStart||'9'));
    out[f]=JSON.stringify({version:2,year:+y||y,events:ev},null,2); }
  return out;
}
let dirty=false,timer=null,saving=false;
function touch(what){ dirty=true; setState('modificato'); clearTimeout(timer); timer=setTimeout(save,1500); if(what!=='none') renderList(); }
async function save(){
  if(saving){ clearTimeout(timer); timer=setTimeout(save,800); return; }
  if(!dirty) return; dirty=false; saving=true; setState('salvataggio…');
  try{
    const out=serialize();
    for(const [n,t] of Object.entries(out)){
      if(saved[n]===t) continue;
      await Store.put(n,t); saved[n]=t; if(n.startsWith('events-')) eventFiles.add(n);
    }
    setState(DEMO?'demo · non salva':'salvato');
  }catch(err){
    if(err instanceof ConflictError){ setState('conflitto: ricaricato, ripeti l’ultima modifica',true); await loadAll(); render(); }
    else{ dirty=true; setState(err.message,true); }
  }finally{ saving=false; }
}
window.addEventListener('beforeunload',e=>{ if(dirty){ save(); e.preventDefault(); e.returnValue=''; } });
function setState(t,err){ const el=$('#savestate'); el.textContent=t; el.className=err?'err':''; }

const DAYS=['dom','lun','mar','mer','gio','ven','sab'];
const today=()=>{ const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
function fmtDay(d){ if(!d) return {n:'–',m:''}; const [y,m,dd]=d.split('-'); return {n:String(+dd),m:MONTHS[+m-1]+' '+y.slice(2)}; }
function fmtRange(e){ const a=fmtDay(e.dateStart); if(!e.dateEnd||e.dateEnd===e.dateStart) return a; const b=fmtDay(e.dateEnd); return {n:a.n+'–'+b.n,m:b.m}; }
function fmtLong(d){ if(!d) return ''; const dt=new Date(d+'T12:00'); return `${DAYS[dt.getDay()]} ${dt.getDate()} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`; }
const longRange=e=>e.dateEnd&&e.dateEnd!==e.dateStart?`${fmtLong(e.dateStart)} → ${fmtLong(e.dateEnd)}`:fmtLong(e.dateStart);
const num=v=>{ const n=parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:0; };
const fmtN=n=>(Math.round(n*100)/100).toLocaleString('it-IT');

/* Two-way binding: rendered inputs point at the object they edit via data-o (index into OBJ). */
let OBJ=[];
const ref=o=>{ OBJ.push(o); return OBJ.length-1; };
const shown=(o,k,t)=>t==='num'&&typeof o[k]==='number'?String(o[k]).replace('.',','):o[k];
function F(o,k,label,{type='text',ph='',cls='',t='',list=''}={}){
  const id='f'+OBJ.length+k;
  return `<div class="fld ${cls}"><label class="f" for="${id}">${label}</label><input id="${id}" type="${type}" data-o="${ref(o)}" data-k="${k}" ${t?`data-t="${t}"`:''} value="${esc(shown(o,k,t))}" placeholder="${esc(ph)}" ${list?`list="${list}"`:''}></div>`;
}
function T(o,k,label,{ph='',cls='',t=''}={}){
  const id='f'+OBJ.length+k, v=t==='lines'?(o[k]||[]).join('\n'):o[k];
  return `<div class="fld ${cls}"><label class="f" for="${id}">${label}</label><textarea id="${id}" data-o="${ref(o)}" data-k="${k}" ${t?`data-t="${t}"`:''} placeholder="${esc(ph)}">${esc(v)}</textarea></div>`;
}
function Sel(o,k,label,opts,{cls='',r=''}={}){
  const id='f'+OBJ.length+k;
  return `<div class="fld ${cls}"><label class="f" for="${id}">${label}</label><select id="${id}" data-o="${ref(o)}" data-k="${k}" ${r?`data-r="${r}"`:''}>${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(o[k]??'')===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
}
const cell=(o,k,{ph='',type='text',t='',label=''}={})=>`<input type="${type}" data-o="${ref(o)}" data-k="${k}" ${t?`data-t="${t}"`:''} value="${esc(shown(o,k,t))}" placeholder="${esc(ph)}" aria-label="${esc(label||ph)}" ${t==='num'?'inputmode="decimal"':''}>`;
function bind(root){
  root.querySelectorAll('[data-o]').forEach(el=>{
    const evn=(el.type==='checkbox'||el.tagName==='SELECT')?'change':'input';
    el.addEventListener(evn,()=>{
      const o=OBJ[+el.dataset.o], k=el.dataset.k, t=el.dataset.t;
      let v=el.type==='checkbox'?el.checked:el.value;
      if(t==='lines') v=v.split('\n').map(s=>s.trim()).filter(Boolean);
      if(t==='num') v=num(v);
      o[k]=v;
      if(el.dataset.r==='detail'){ touch(); renderDetail(); } else touch();
    });
  });
}
const on=(root,sel,fn)=>root.querySelectorAll(sel).forEach(el=>el.addEventListener('click',ev=>fn(el,ev)));

      ${Sel(c,'startType','Tipo di partenza',[['','—'],...S.config.startTypes.map(s=>[s,s])])}
      ${F(c,'route','Percorso',{ph:'Partenza → Arrivo'})}
      ${F(c,'eligibility','Ammessi / requisiti',{ph:'es. nati 2010 e prima',cls:'wide'})}
    </div>
    <div class="sub">Sequenza dei punti</div>
    <div class="seq">${c.splits.map((s,si)=>`<div class="srow"><select data-o="${ref(s)}" data-k="tp" aria-label="Punto ${si+1}">${tpOpts.map(([v,l])=>`<option value="${esc(v)}" ${s.tp===v?'selected':''}>${esc(l)}</option>`).join('')}</select><input data-o="${ref(s)}" data-k="km" value="${esc(s.km)}" placeholder="km" aria-label="km punto ${si+1}"><button class="btn sm ghost danger" data-delsp="${ci}:${si}" type="button" aria-label="Rimuovi">×</button></div>`).join('')}
      <button class="btn sm" data-addsp="${ci}" type="button" ${e.timingPoints.length?'':'disabled title="Aggiungi prima i punti di cronometraggio"'}>+ Punto in sequenza</button></div>
    <div class="two">
      ${T(c,'rankings','Classifiche (una per riga)',{t:'lines',ph:'Scratch U/D\nCategorie (primi 3)'})}
      ${T(c,'teamScores','Punteggi di squadra (uno per riga)',{t:'lines',ph:'es. Società: somma 3 migliori tempi'})}
      ${T(c,'relay','Staffetta',{ph:'Frazioni, punti di cambio…'})}
      ${T(c,'notes','Note gara')}
    </div>
    <div class="grid" style="margin-top:12px">${F(c,'myrrUrl','Pagina / lista my.rr della gara',{type:'url',ph:'https://…',cls:'wide'})}</div>
  </div>`;
}

/* ---------------- HOURS table (shared) ---------------- */
function hoursTable(rows,{showEvent=true,showClient=true}={}){
  if(!rows.length) return '<p class="hint">Nessuna ora registrata.</p>';
  return `<table class="t resp"><thead><tr><th>Data</th>${showClient?'<th>Cliente</th>':''}${showEvent?'<th>Evento</th>':''}<th>Attività</th><th class="num">Ore</th><th class="num">${esc(U().icon)}</th><th>Stato</th><th></th></tr></thead><tbody>
  ${rows.map(h=>{ const c=clientOf(h.clientId), cl=h.closure&&S.hours.closures.find(x=>x.id===h.closure);
    const coef=cl?cl.coefficient:num(c?.coefficient), ev=S.events.find(x=>x.id===h.eventId);
    return `<tr class="${h.closure?'closed':''}">
      <td>${h.closure?esc(h.date):cell(h,'date',{type:'date',label:'Data'})}</td>
      ${showClient?`<td>${esc(c?.name||'—')}</td>`:''}
      ${showEvent?`<td>${ev?`<a href="#/e/${encodeURIComponent(ev.id)}">${esc(ev.name)}</a>`:'<span class="hint">generico</span>'}</td>`:''}
      <td>${h.closure?esc(h.note):cell(h,'note',{ph:'—',label:'Attività'})}</td>
      <td class="num" style="width:80px">${h.closure?fmtN(num(h.hours)):cell(h,'hours',{t:'num',label:'Ore'})}</td>
      <td class="num">${val(num(h.hours)*coef)}</td>
      <td>${h.closure?`<span class="tag" title="${esc(cl?.ref||'')}">chiusa</span>`:'<span class="tag open">aperta</span>'}</td>
      <td class="x">${h.closure?'':`<button class="btn sm ghost danger" data-delh="${esc(h.id)}" type="button" aria-label="Elimina riga">×</button>`}</td></tr>`; }).join('')}
  </tbody></table>`;
}
function bindHoursTable(D){
  on(D,'[data-delh]',b=>{ S.hours.entries=S.hours.entries.filter(h=>h.id!==b.dataset.delh); touch(); renderDetail(); });
  D.querySelectorAll('table.t [data-k=hours]').forEach(i=>i.addEventListener('change',()=>renderDetail()));
}

/* ---------------- CLIENT ---------------- */
function renderClient(D){
  const c=S.clients.find(x=>x.id===route.id);
  if(!c){ D.innerHTML=`<div class="empty"><h2>Scegli un cliente</h2>Oppure creane uno con «+ Cliente». Il coefficiente moltiplica le ore e dà i ${esc(U().label)} ${esc(U().icon)}.</div>`; return; }
  const ev=S.events.filter(e=>e.clientId===c.id).sort((a,b)=>(a.dateStart||'9').localeCompare(b.dateStart||'9'));
  const all=entriesOf(h=>h.clientId===c.id), open=all.filter(isOpen);
  const closures=S.hours.closures.filter(x=>x.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  const coef=num(c.coefficient);
  const closedVal=closures.reduce((s,x)=>s+x.value,0), closedH=closures.reduce((s,x)=>s+x.hours,0);
  D.innerHTML=`
  <div class="title"><input class="name" data-o="${ref(c)}" data-k="name" value="${esc(c.name)}" placeholder="Nome cliente" aria-label="Nome cliente"></div>
  <div class="grid">
    ${F(c,'contact','Referente')}${F(c,'email','Email',{type:'email'})}${F(c,'phone','Telefono',{type:'tel'})}
    ${F(c,'coefficient','Coefficiente',{t:'num',ph:'1'})}
    ${T(c,'notes','Note',{cls:'wide'})}
  </div>
  <h3>Situazione</h3>
  <div class="stats">
    <div class="stat"><b>${ev.length}</b><span>eventi</span></div>
    <div class="stat"><b>${fmtN(sumH(open))}</b><span>ore aperte</span></div>
    <div class="stat"><b>${val(sumH(open)*coef)}</b><span>${esc(U().label)} aperti</span></div>
    <div class="stat"><b>${fmtN(closedH)}</b><span>ore chiuse</span></div>
    <div class="stat"><b>${val(closedVal)}</b><span>${esc(U().label)} chiusi</span></div>
  </div>
  <h3>Eventi</h3>
  ${ev.length?`<table class="t"><tbody>${ev.map(e=>`<tr><td style="width:150px">${esc(longRange(e))}</td><td><a href="#/e/${encodeURIComponent(e.id)}">${esc(e.name||'senza nome')}</a></td><td><i class="dot" style="background:${esc(statusColor(e.status))}"></i>${esc(e.status)}</td><td class="num">${openQ(e).length?`<span class="qbadge">${openQ(e).length} ?</span>`:''}</td><td class="num">${fmtN(sumH(all.filter(h=>h.eventId===e.id)))} h</td></tr>`).join('')}</tbody></table>`:'<p class="hint">Nessun evento.</p>'}
  <h3>Chiudi periodo</h3>
  <p class="hint" style="margin-top:0">Segna come chiuse le ore aperte fino alla data scelta. Il coefficiente di oggi resta fissato nella chiusura.</p>
  <div class="closebox">
    <div class="fld"><label class="f" for="cl-until">Fino al</label><input id="cl-until" type="date" value="${today()}"></div>
    <div class="fld"><label class="f" for="cl-ref">Riferimento</label><input id="cl-ref" placeholder="es. 2026-10"></div>
    <button class="btn primary" id="cl-go" type="button" ${open.length?'':'disabled'}>Chiudi</button>
  </div>
  <p class="hint" id="cl-preview"></p>
  <h3>Chiusure</h3>
  ${closures.length?`<table class="t resp"><thead><tr><th>Chiusa il</th><th>Fino al</th><th>Rif.</th><th class="num">Ore</th><th class="num">Coeff.</th><th class="num">${esc(U().icon)}</th><th></th></tr></thead><tbody>
    ${closures.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.until)}</td><td>${esc(x.ref)}</td><td class="num">${fmtN(x.hours)}</td><td class="num">${showValues?fmtN(x.coefficient):'•••'}</td><td class="num">${val(x.value)}</td><td class="x"><button class="btn sm ghost" data-reopen="${esc(x.id)}" type="button" title="Riapri queste ore">Annulla</button></td></tr>`).join('')}</tbody></table>`:'<p class="hint">Nessuna chiusura.</p>'}
  <h3>Ore aperte · ${fmtN(sumH(open))} h</h3>
  ${hoursTable(open.sort((a,b)=>a.date.localeCompare(b.date)),{showClient:false})}
  <div class="foot"><span>id: ${esc(c.id)}</span><button class="btn sm danger" id="delcl" type="button">Elimina cliente</button></div>`;

  const preview=()=>{ const u=$('#cl-until').value, rows=open.filter(h=>!u||h.date<=u);
    $('#cl-preview').textContent=rows.length?`${rows.length} righe · ${fmtN(sumH(rows))} h${showValues?` · ${fmtN(sumH(rows)*coef)} ${U().icon}`:''}`:'Nessuna ora aperta in questo intervallo.'; return rows; };
  preview(); $('#cl-until').oninput=preview;
  $('#cl-go').onclick=()=>{ const rows=preview(); if(!rows.length) return;
    if(!confirm(`Chiudere ${rows.length} righe (${fmtN(sumH(rows))} h)?`)) return;
    const h=sumH(rows), x={id:uid('cl'),clientId:c.id,date:today(),until:$('#cl-until').value,ref:$('#cl-ref').value.trim(),hours:h,coefficient:coef,value:Math.round(h*coef*100)/100,entryIds:rows.map(r=>r.id)};
    S.hours.closures.push(x); for(const r of rows) r.closure=x.id; touch(); renderDetail(); };
  on(D,'[data-reopen]',b=>{ const x=S.hours.closures.find(y=>y.id===b.dataset.reopen); if(!x||!confirm('Riaprire le ore di questa chiusura?')) return;
    for(const h of S.hours.entries) if(h.closure===x.id) h.closure=null; S.hours.closures=S.hours.closures.filter(y=>y!==x); touch(); renderDetail(); });
  D.querySelector('[data-k=coefficient]').addEventListener('change',()=>renderDetail());
  bindHoursTable(D);
  $('#delcl').onclick=()=>{ if(ev.length||all.length){ alert('Il cliente ha eventi o ore collegati: spostali o eliminali prima.'); return; }
    if(confirm(`Eliminare il cliente «${c.name}»?`)){ S.clients=S.clients.filter(x=>x!==c); touch(); go('c'); } };
}

/* ---------------- HOURS view ---------------- */
const hf={client:'',state:'open',month:''};
function renderHours(D){
  const rows=S.hours.entries.filter(h=>(!hf.client||h.clientId===hf.client)&&(hf.state==='all'||(hf.state==='open')===isOpen(h))&&(!hf.month||h.date.startsWith(hf.month)))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const tot=rows.reduce((s,h)=>{ const cl=h.closure&&S.hours.closures.find(x=>x.id===h.closure); return s+num(h.hours)*(cl?cl.coefficient:num(clientOf(h.clientId)?.coefficient)); },0);
  const addC=hf.client||S.clients[0]?.id||'';
  D.innerHTML=`
  <div class="title"><h2 style="margin:0;font-size:24px">Ore</h2></div>
  <div class="hoursbar">
    <select id="hf-client" aria-label="Cliente"><option value="">Tutti i clienti</option>${S.clients.map(c=>`<option value="${esc(c.id)}" ${hf.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <select id="hf-state" aria-label="Stato">${[['open','Aperte'],['closed','Chiuse'],['all','Tutte']].map(([v,l])=>`<option value="${v}" ${hf.state===v?'selected':''}>${l}</option>`).join('')}</select>
    <input type="month" id="hf-month" value="${hf.month}" aria-label="Mese">
    <span class="hint" style="margin-left:auto"><b>${fmtN(sumH(rows))} h</b> · ${val(tot)}</span>
  </div>
  <div class="addrow wide" id="addform" style="margin:0 0 16px">
    <select id="a-client" aria-label="Cliente">${S.clients.map(c=>`<option value="${esc(c.id)}" ${addC===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <select id="a-event" aria-label="Evento"></select>
    <input type="date" id="a-date" value="${today()}" aria-label="Data">
    <input id="a-hours" inputmode="decimal" placeholder="Ore" aria-label="Ore">
    <input id="a-note" class="grow" placeholder="Cosa hai fatto" aria-label="Attività">
    <button class="btn primary" id="a-add" type="button" ${S.clients.length?'':'disabled'}>Aggiungi</button>
  </div>
  ${hoursTable(rows)}`;
  const fillEv=()=>{ const cid=$('#a-client').value; $('#a-event').innerHTML=`<option value="">— generico (nessun evento) —</option>`+S.events.filter(e=>e.clientId===cid).sort((a,b)=>(b.dateStart||'').localeCompare(a.dateStart||'')).map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join(''); };
  fillEv(); $('#a-client').onchange=fillEv;
  $('#hf-client').onchange=e=>{ hf.client=e.target.value; renderDetail(); };
  $('#hf-state').onchange=e=>{ hf.state=e.target.value; renderDetail(); };
  $('#hf-month').onchange=e=>{ hf.month=e.target.value; renderDetail(); };
  $('#a-add').onclick=()=>{ const h=num($('#a-hours').value); if(!h||!$('#a-client').value) return;
    S.hours.entries.push({id:uid('h'),clientId:$('#a-client').value,eventId:$('#a-event').value||null,date:$('#a-date').value||today(),hours:h,note:$('#a-note').value.trim(),closure:null}); touch('none'); renderDetail(); };
  $('#a-note').onkeydown=ev=>{ if(ev.key==='Enter') $('#a-add').click(); };
  bindHoursTable(D);
}

/* =====================================================================
   CLIENT SUMMARY (no hours, no internal notes)
   ===================================================================== */
let sumEvent=null;
function summaryHTML(e,withResolved){
  const tpName=id=>(e.timingPoints.find(t=>t.id===id)||{}).name||'?';
  const pct=Math.round(progress(e)*100), oq=openQ(e), rq=(e.questions||[]).filter(q=>q.resolved);
  const anyDate=e.contests.some(c=>c.date), anyTime=e.contests.some(c=>c.startTime), anyEl=e.contests.some(c=>c.elevation), anyElig=e.contests.some(c=>c.eligibility);
  return `<div class="sheet">
    <h1>${esc(e.name)}</h1>
    <div class="meta">${esc(longRange(e))}${e.location?' · '+esc(e.location):''}${e.website?' · '+esc(e.website):''}</div>
    <div><span class="pill" style="background:${esc(statusColor(e.status))}">${esc(e.status)}</span><span class="prog"><i style="width:${pct}%"></i></span>${pct}% preparazione${oq.length?` · <b style="color:#c7781b">${oq.length} ${oq.length===1?'domanda aperta':'domande aperte'}</b>`:''}</div>
    ${oq.length?`<h2>Domande aperte</h2><ul class="qs">${oq.map(q=>`<li><b>D${q.n}</b><span>${esc(q.text)}</span></li>`).join('')}</ul>`:''}
    ${e.contests.length?`<h2>Gare</h2><table><thead><tr><th>Gara</th>${anyDate?'<th>Giorno</th>':''}${anyTime?'<th>Partenza</th>':''}<th>Distanza</th>${anyEl?'<th>D+</th>':''}${anyElig?'<th>Ammessi</th>':''}</tr></thead><tbody>
      ${e.contests.map(c=>`<tr><td><b>${esc(c.name)}</b>${c.route?`<div class="route">${esc(c.route)}${c.startType?' · partenza '+esc(c.startType):''}</div>`:c.startType?`<div class="route">partenza ${esc(c.startType)}</div>`:''}</td>${anyDate?`<td>${esc(fmtLong(c.date))}</td>`:''}${anyTime?`<td>${esc(c.startTime)}</td>`:''}<td>${c.distance?esc(c.distance)+' km':'—'}</td>${anyEl?`<td>${c.elevation?esc(c.elevation)+' m':''}</td>`:''}${anyElig?`<td>${esc(c.eligibility)}</td>`:''}</tr>`).join('')}</tbody></table>`:''}
    ${e.contests.some(c=>c.splits?.length)?`<h2>Punti di cronometraggio per gara</h2>${e.contests.filter(c=>c.splits?.length).map(c=>`<div><b>${esc(c.name)}</b><div class="seqline">${c.splits.map(s=>`${esc(tpName(s.tp))}${s.km!==''&&s.km!=null?` <span style="color:#5a6670">(${esc(s.km)} km)</span>`:''}`).join(' → ')}</div></div>`).join('')}`:''}
    ${e.timingPoints.some(t=>t.position)?`<h2>Posizioni</h2><table><tbody>${e.timingPoints.filter(t=>t.position).map(t=>`<tr><td style="width:40%">${esc(t.name)}</td><td>${esc(t.position)}</td></tr>`).join('')}</tbody></table>`:''}
    ${e.contests.some(c=>c.rankings?.length||c.teamScores?.length||c.relay)?`<h2>Classifiche</h2><table><tbody>${e.contests.filter(c=>c.rankings?.length||c.teamScores?.length||c.relay).map(c=>`<tr><td style="width:30%"><b>${esc(c.name)}</b></td><td>${[...(c.rankings||[]),...(c.teamScores||[]).map(t=>'Squadre: '+t),...(c.relay?['Staffetta: '+c.relay]:[])].map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table>`:''}
    ${withResolved&&rq.length?`<h2>Domande risolte</h2><ul class="qs done">${rq.map(q=>`<li><b>D${q.n}</b><span>${esc(q.text)}${q.answer?`<div class="a">→ ${esc(q.answer)}</div>`:''}</span></li>`).join('')}</ul>`:''}
    ${e.myrrUrl?`<h2>Risultati</h2><div>${esc(e.myrrUrl)}</div>`:''}
    <div class="footer"><span>${esc(clientName(e.clientId))}</span><span>Aggiornato al ${esc(fmtLong(today()))}</span></div>
  </div>`;
}
function openSummary(e){ sumEvent=e; $('#sum-resolved').checked=false; $('#sumsheet').innerHTML=summaryHTML(e,false); $('#sumdlg').showModal(); }
$('#sum-resolved').onchange=ev=>{ $('#sumsheet').innerHTML=summaryHTML(sumEvent,ev.target.checked); };
$('#sum-close').onclick=()=>$('#sumdlg').close();
$('#sum-pdf').onclick=()=>{
  $('#printarea').innerHTML=summaryHTML(sumEvent,$('#sum-resolved').checked);
  $('#sumdlg').close(); document.body.classList.add('printing');
  const done=()=>{ document.body.classList.remove('printing'); $('#printarea').innerHTML=''; window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done); setTimeout(()=>window.print(),50);
};
let h2c=null;
function loadH2C(){ return h2c||(h2c=new Promise((ok,ko)=>{ const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.integrity='sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H'; s.crossOrigin='anonymous';
  s.onload=()=>ok(window.html2canvas); s.onerror=()=>{ h2c=null; ko(new Error('html2canvas non caricato')); }; document.head.appendChild(s); })); }
$('#sum-png').onclick=async()=>{
  const b=$('#sum-png'); b.disabled=true; b.textContent='Preparo…';
  try{ const html2canvas=await loadH2C(); await document.fonts?.ready;
    const canvas=await html2canvas($('#sumsheet .sheet'),{scale:2,backgroundColor:'#ffffff',logging:false});
    const a=document.createElement('a'); a.download=`riepilogo-${slug(sumEvent.name||'evento')}-${today()}.png`; a.href=canvas.toDataURL('image/png'); a.click();
  }catch(err){ alert(err.message); }
  finally{ b.disabled=false; b.textContent='Scarica PNG'; }
};

/* =====================================================================
   TOOLBAR, SETTINGS, BOOT
   ===================================================================== */
$('#newbtn').onclick=()=>{
  if(route.view==='c'){ const c={id:uid('cl'),name:'',contact:'',email:'',phone:'',coefficient:1,notes:''}; S.clients.push(c); touch(); go('c',c.id); setTimeout(()=>$('#detail .name')?.focus(),0); return; }
  if(route.view==='h'){ $('#a-hours')?.focus(); return; }
  const e={id:uid('ev'),clientId:flt.client||(S.clients.length===1?S.clients[0].id:''),name:'',dateStart:'',dateEnd:'',location:'',type:'',status:S.config.statuses[0]?.name||'',website:'',rr14EventId:'',myrrUrl:'',links:[],timingPoints:[],contests:[],presenter:[],questions:[],checklist:{},notes:''};
  S.events.push(e); touch(); go('e',e.id); setTimeout(()=>$('#detail .name')?.focus(),0);
};
$('#back').onclick=()=>go(route.view);
$('#unitbtn').onclick=()=>{ showValues=!showValues; $('#unitbtn').setAttribute('aria-pressed',showValues); renderDetail(); };

const dlg=$('#settings');
function openSettings(msg=''){ $('#s-owner').value=cfg.owner; $('#s-repo').value=cfg.repo; $('#s-dir').value=cfg.dir; $('#s-token').value=cfg.token; $('#s-msg').textContent=msg; dlg.showModal(); }
$('#setbtn').onclick=()=>{ if(DEMO){ alert('Modalità demo: i dati arrivano da ../data e non vengono salvati.'); return; } openSettings(); };
$('#s-cancel').onclick=()=>dlg.close();
$('#s-logout').onclick=()=>{ if(!confirm('Rimuovere il token da questo browser?')) return; cfg.token=''; saveCfg(); location.reload(); };
$('#s-save').onclick=async()=>{
  cfg={owner:$('#s-owner').value.trim(),repo:$('#s-repo').value.trim(),dir:$('#s-dir').value.trim()||'data',token:$('#s-token').value.trim()};
  if(!cfg.owner||!cfg.repo||!cfg.token){ $('#s-msg').textContent='Compila utente, repository e token.'; return; }
  try{
    let res=await loadAll();
    if(res==='missing'){
      if(!confirm(`La cartella «${cfg.dir}» non esiste in ${cfg.owner}/${cfg.repo}. Crearla con file vuoti?`)) return;
      S={config:structuredClone(DEFAULT_CONFIG),clients:[],events:[],hours:{entries:[],closures:[]}}; saved={}; eventFiles=new Set();
      dirty=true; await save();
    }
    saveCfg(); dlg.close(); render();
  }catch(err){ $('#s-msg').textContent=err.message+'. Controlla utente, repo e permessi del token.'; }
};

new ResizeObserver(([en])=>document.documentElement.style.setProperty('--hh',en.target.offsetHeight+'px')).observe($('header'));

(async()=>{
  parseRoute();
  if(!DEMO&&(!cfg.token||!cfg.owner)){ openSettings(); return; }
  try{ await loadAll(); render(); }catch(err){ setState(err.message,true); if(!DEMO) openSettings(err.message); }
})();
</script>
