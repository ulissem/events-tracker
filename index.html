<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Events tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Events">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f2; --panel:#ffffff; --panel-2:#f6f7f9; --ink:#1b232b; --ink-2:#5a6670; --line:#d7dce1;
  --accent:#1f4e79; --accent-ink:#ffffff; --accent-soft:#e8eef5;
  --ok:#2d8a4e; --warn:#d9730d; --warn-soft:#fdf0e3; --danger:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14191e; --panel:#1c2329; --panel-2:#232b32; --ink:#e3e8ec; --ink-2:#97a3ad; --line:#323c45;
    --accent:#7fb0e0; --accent-ink:#0f1a24; --accent-soft:#22313f;
    --ok:#5cbf7d; --warn:#f0a050; --warn-soft:#3a2a18; --danger:#ef7a72; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* header */
header{display:flex;align-items:center;gap:10px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{margin:0 8px 0 0;font-size:16px;font-weight:600;white-space:nowrap}
nav.tabs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px}
nav.tabs a{padding:5px 12px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
header .spacer{flex:1}
#savestate{font-size:13px;color:var(--ink-2);text-align:right}
#savestate.dirty{color:var(--warn)}
#savestate.err{color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.icon{padding:6px;width:34px;height:34px;justify-content:center}
.btn.icon svg{width:18px;height:18px;display:block}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
#unitbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
#savebtn{color:var(--ink-2)}
#savebtn.dirty{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
#savebtn.saving{animation:pulse 1s ease-in-out infinite}
#savebtn.err{color:var(--danger);border-color:var(--danger)}
@keyframes pulse{50%{opacity:.45}}

/* layout */
main{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 54px)}
main.full{grid-template-columns:1fr}
#list{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;position:sticky;top:var(--hh,54px);align-self:start;height:calc(100vh - var(--hh,54px))}
#detail{padding:26px 32px 60px;max-width:1600px;min-width:0}
.evgrid{max-width:980px}
.evmain{container:ev/inline-size;min-width:0}
@container ev (max-width:599px){
  table.t.tps thead,table.t.splits thead{display:none}
  table.t.tps tr,table.t.splits tr{display:grid;border-bottom:1px solid var(--line);padding:6px 0}
  table.t.tps td,table.t.splits td{border:0;width:auto!important}
  table.t.tps tr{grid-template-columns:48px 70px 70px minmax(0,1fr) 34px;grid-template-areas:"a b b b i" "a c c c c" "a d e f f" "a g g g g" "a h h h h"}
  table.t.splits tr{grid-template-columns:44px minmax(0,1fr) 80px 34px;grid-template-areas:"a b b f" "a c c c" "a d e e"}
  table.t.tps td:nth-child(1),table.t.splits td:nth-child(1){grid-area:a}
  table.t.tps td:nth-child(2),table.t.splits td:nth-child(2){grid-area:b}
  table.t.tps td:nth-child(3),table.t.splits td:nth-child(3){grid-area:c}
  table.t.tps td:nth-child(4),table.t.splits td:nth-child(4){grid-area:d}
  table.t.tps td:nth-child(5),table.t.splits td:nth-child(5){grid-area:e}
  table.t.tps td:nth-child(6),table.t.splits td:nth-child(6){grid-area:f}
  table.t.tps td:nth-child(7){grid-area:g}
  table.t.tps td:nth-child(8){grid-area:h}
  table.t.tps td:nth-child(9){grid-area:i}
  table.t.splits td.gr{padding-top:10px}
}
.sidebtn{display:none}
.sidebtn[aria-pressed="false"]{color:var(--ink-2)}
@media (min-width:1720px){ .sidebtn{display:inline-flex} .evgrid.stacked{max-width:1400px} .evgrid:not(.stacked){max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,400px);gap:0 32px;align-items:start} .evgrid:not(.stacked) .evside{position:sticky;top:calc(var(--hh,54px) + 12px);max-height:calc(100vh - var(--hh,54px) - 24px);overflow-y:auto;padding-right:4px} .evgrid:not(.stacked) .evside > h3:first-child{margin-top:0} }
main.full #list{display:none}
main.full #detail{max-width:1100px}

/* list */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.filters input[type=search]{grid-column:1/-1}
.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);min-width:0}
.filters label{grid-column:1/-1;font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:0 14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:4px solid transparent;border-top:0;border-right:0}
.row:hover{background:var(--panel-2)}
.row.active{background:var(--accent-soft);border-left-color:var(--accent)}
.row.past{opacity:.55}
.row .d{font-size:21px;font-weight:600;line-height:1}
.row .d small{display:block;font-size:11px;font-weight:500;color:var(--ink-2);margin-top:3px}
.row .n{font-weight:500}
.row .m{font-size:13px;color:var(--ink-2)}
.row .st{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--ink-2)}
.row.client{grid-template-columns:1fr auto}
.bar{width:64px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px;background:var(--ink-2)}
.qbadge{color:var(--warn);font-weight:500}
.listfoot{padding:14px 16px;font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px}

/* detail */
.empty{color:var(--ink-2);padding-top:40px;max-width:460px}
.empty h2{font-weight:600;margin:0 0 8px;color:var(--ink)}
.title{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.title input.name{flex:1;font-size:26px;font-weight:600;border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;min-width:0}
.title input.name:hover,.title input.name:focus{border-bottom-color:var(--line);outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px;margin-bottom:8px}
.grid .wide{grid-column:1/-1}
label.f,span.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.fld input,.fld select,.fld textarea,input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--panel);min-width:0}
textarea{resize:vertical;min-height:62px;line-height:1.4}
h3{font-size:13px;font-weight:600;color:var(--ink-2);margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
h3 .sp{flex:1}
h3 .btn{font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.inline{display:flex;gap:8px;align-items:center}
.inline > input,.inline > select{flex:1}
.hint{font-size:13px;color:var(--ink-2)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-weight:500;color:var(--ink-2);font-size:12px}
table.t .num{text-align:right;white-space:nowrap}
table.t td input,table.t td select{width:100%;border:1px solid transparent;border-radius:5px;padding:5px 6px;background:none;min-width:0}
table.t td input:hover,table.t td input:focus,table.t td select:hover,table.t td select:focus{border-color:var(--line);background:var(--panel)}
table.t td.x{width:34px;text-align:right}
table.t tr.closed td{color:var(--ink-2)}
.tag{font-size:12px;padding:1px 7px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.open{color:var(--warn);border-color:currentColor;background:none}

.card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px 16px;margin-bottom:14px}
.cardhead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.cardhead input{flex:1;font-size:17px;font-weight:600;border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;min-width:0}
.cardhead input:hover,.cardhead input:focus{border-bottom-color:var(--line);outline:0}
.seq{margin:4px 0 12px}
.card.race{padding:0}
.racehead{display:flex;align-items:center;gap:6px;padding:10px 12px 10px 6px;cursor:pointer;border-radius:10px}
.racehead:hover{background:var(--panel-2)}
.racehead .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.racehead .rt b{font-size:16px;font-weight:600}
.racehead .rm{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.racehead .chev svg{transition:transform .15s}
.race.open .racehead{border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.race.open .chev svg{transform:rotate(90deg)}
.racebody{padding:14px 16px 16px}
.dayro{padding:7px 0;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:4px 14px 4px 6px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--line)}
.seg button .hwimg{filter:grayscale(1);opacity:.4}
.seg button[aria-checked="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.seg button[aria-checked="true"] .hwimg{filter:none;opacity:1}
.hwimg{width:30px;height:30px;border-radius:6px;background:#eef1f4;object-fit:contain;padding:2px;flex:none}
.seg .hwimg{width:28px;height:28px}
.hwcell{display:flex;align-items:center;gap:6px}
.hwcell select{flex:1;min-width:0}
table.t td.gr{width:44px;white-space:nowrap}
table.t td.gr > *{vertical-align:middle;display:inline-flex}
@container ev (min-width:600px){
  .tpwrap{overflow-x:auto}
  table.t.tps{table-layout:fixed;min-width:830px}
  table.t.tps th:nth-child(1){width:52px} table.t.tps th:nth-child(2){width:21%} table.t.tps th:nth-child(3){width:185px}
  table.t.tps th:nth-child(4),table.t.tps th:nth-child(5){width:58px} table.t.tps th:nth-child(6){width:124px}
  table.t.tps th:nth-child(7){width:48px} table.t.tps th:nth-child(9){width:34px}
}
table.t tr.dup select.idsel{border-color:var(--danger)!important;color:var(--danger)}
.rep{font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep.bad{color:var(--warn)}
.pin{color:var(--ink-2);opacity:.6}
.pin.set{color:var(--accent);opacity:1}
#pospop{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:12px;width:280px}
#pospop .f{margin-bottom:6px}
#pospop input{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--panel)}
#pospop .actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.hwsel{flex:1;min-width:0;display:flex;flex-direction:column}
.hwsel select{width:100%}
.hwsel .rep{padding-left:6px;margin-top:-2px}
.alerts{margin:8px 0 0;padding:8px 12px;border:1px solid var(--danger);border-radius:8px;color:var(--danger);font-size:13px}
.check li.auto label{cursor:default}
.check .tag{margin-left:6px;font-size:11px}
.check .grp{font-size:12px;color:var(--ink-2);font-weight:500;margin:10px 0 2px;break-after:avoid}
table.t td.n{width:26px;color:var(--ink-2);font-size:12px;text-align:right}
table.t td.sw{width:38px}
input.swatch,table.t td input.swatch{width:28px;flex:none;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
input.swatch::-webkit-color-swatch-wrapper{padding:2px}
input.swatch::-webkit-color-swatch{border:0;border-radius:4px}
table.t td.sm{width:64px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2)}
.warn{color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
a.plain{color:var(--accent);text-decoration:none;padding:7px 0;display:inline-block}
.sub{font-size:12px;color:var(--ink-2);margin:12px 0 5px;font-weight:500}

.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink-2);opacity:.45;display:flex;align-items:center;justify-content:center;width:16px;height:28px;border-radius:4px}
.grip svg{width:10px;height:16px}
.grip:hover{opacity:1;background:var(--panel-2)}
.dragging{opacity:.75;background:var(--accent-soft)!important;border-radius:6px}
body.sorting,body.sorting *{cursor:grabbing!important;user-select:none}
/* checkable lists: grip · check · name · [url · open] · note · + · × — one level of sub-items */
.tasks{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);margin-bottom:12px}
.tasks > .f{margin:2px 2px 4px}
.task{display:grid;grid-template-columns:16px 22px minmax(0,1fr) minmax(0,1.3fr) 30px 30px;gap:4px;align-items:center;min-height:34px}
.tasks.wurl .task{grid-template-columns:16px 22px minmax(0,1fr) minmax(0,1fr) 52px minmax(0,1.2fr) 30px 30px}
.tkids .task{margin-left:26px}
.task.add{grid-template-columns:16px 22px minmax(0,1fr)!important}
.task .tn{color:var(--ink-2);font-size:13px}
.task .tn:not(:placeholder-shown){color:var(--ink)}
.task a.btn{justify-content:center}
.task input[type=checkbox],.check input{width:16px;height:16px;margin:0 0 0 2px;accent-color:var(--ok)}
.task .tt{border:1px solid transparent;border-radius:5px;padding:4px 6px;background:none;min-width:0;width:100%}
.task .tt:hover,.task .tt:focus{border-color:var(--line)}
.task.done .tt{text-decoration:line-through;color:var(--ink-2)}
.task.add .plus{color:var(--ink-2);text-align:center}
.task.add .tt{color:var(--ink-2)}
.task.add .tt:focus{color:var(--ink)}
.task .btn{opacity:.5}
.task:hover .btn,.task .btn:focus{opacity:1}
.taskcount{font-weight:400;color:var(--ink-2);margin-left:4px}

.q{display:grid;grid-template-columns:38px 1fr auto;gap:8px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.q .qn{font-weight:600;color:var(--warn);padding-top:7px}
.q.resolved .qn{color:var(--ok)}
.q.resolved textarea[data-k=text]{color:var(--ink-2)}
.q textarea{min-height:38px}
.q .qa{grid-column:2}
.q .qc{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.q label{font-size:13px;display:flex;gap:5px;align-items:center;color:var(--ink-2);white-space:nowrap}

.check{list-style:none;margin:0 0 12px;padding:0;columns:2;column-gap:28px}
.evside .check{columns:1}
.check li{break-inside:avoid;padding:4px 0}
.check label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.check input{margin:4px 0 0;width:15px;height:15px;flex:none}
.check .done{color:var(--ink-2);text-decoration:line-through}

.addrow{display:grid;grid-template-columns:150px 90px 1fr auto;gap:8px;margin-top:10px}
.addrow.wide{grid-template-columns:160px 1fr 140px 90px 1fr auto}
.addrow input,.addrow select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);min-width:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:12px;color:var(--ink-2)}
.closebox{display:grid;grid-template-columns:160px 1fr auto;gap:8px;align-items:end}
.foot{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);gap:10px}
.hoursbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.hoursbar select,.hoursbar input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel)}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:12px;padding:24px 26px;max-width:480px;width:calc(100% - 32px);color:var(--ink);background:var(--panel)}
dialog::backdrop{background:rgba(20,30,40,.45)}
dialog h2{margin:0 0 6px;font-size:18px}
dialog p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
dialog .fld{margin-bottom:12px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
details.adv{margin:4px 0 8px;font-size:13px;color:var(--ink-2)}
details.adv summary{cursor:pointer;margin-bottom:10px}
.msg{font-size:14px;color:var(--danger);min-height:20px;margin-top:6px}
#sumdlg{max-width:900px;padding:0;background:var(--bg)}
#sumdlg .sumbar{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;flex-wrap:wrap}
#sumdlg .sumbar label{font-size:13px;color:var(--ink-2);display:flex;gap:5px;align-items:center;margin-right:auto}
#sumdlg .sumwrap{padding:16px;overflow-x:auto}

/* summary sheet: always light, fixed palette (exported as image) */
.sheet{width:800px;margin:0 auto;background:#fff;color:#1b232b;padding:36px 40px;font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.sheet h1{font-size:26px;margin:0 0 4px;font-weight:600}
.sheet .meta{color:#5a6670;margin-bottom:18px}
.sheet .pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;color:#fff;margin-right:8px;vertical-align:2px}
.sheet h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#5a6670;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid #d7dce1;font-weight:600}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{padding:5px 8px 5px 0;border-bottom:1px solid #eceff2;text-align:left;vertical-align:top}
.sheet th{font-size:11px;color:#5a6670;font-weight:500}
.sheet .route{font-size:13px;color:#5a6670}

.sheet .qs .a{color:#5a6670;font-size:13px}

#printarea{display:none}

@media (max-width:860px){
  header{padding-left:12px;padding-right:12px;gap:8px}
  header h1,#savestate{display:none}
  main{grid-template-columns:1fr}
  #list{border-right:0;position:static;height:auto}
  #detail{padding:18px 16px 60px}
  body.showing-detail #list{display:none}
  body:not(.showing-detail) main:not(.full) #detail{display:none}
  .check{columns:1}
  .two{grid-template-columns:1fr}
  .addrow,.addrow.wide{grid-template-columns:1fr 1fr}
  .addrow .grow{grid-column:1/-1}
  .closebox{grid-template-columns:1fr 1fr}
  .q{grid-template-columns:32px 1fr}
  .q .qc{grid-column:2;flex-direction:row;justify-content:space-between}
  .task .btn{opacity:1}
  .task,.tasks.wurl .task{grid-template-columns:16px 22px minmax(0,1fr) 30px 30px;grid-template-areas:"g c t s x" ". . u o o" ". . n n n"}
  .task > .grip{grid-area:g} .task > .tc{grid-area:c} .task > .tx{grid-area:t} .task .tu{grid-area:u} .task > a.btn{grid-area:o;justify-self:start}
  .task .tn{grid-area:n} .task .addsub{grid-area:s} .task .del{grid-area:x}
  .tkids .task{margin-left:14px}
  .task.add{grid-template-areas:none}
  .task.add > *{grid-area:auto!important}
  table.t.resp thead{display:none}
  table.t.resp tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);padding:6px 0}
  table.t.resp td{border:0}
  table.t.resp td.sm,table.t.resp td.x,table.t.resp td.n{width:auto}
}
@media print{
  body.printing > *:not(#printarea){display:none!important}
  body.printing{background:#fff}
  body.printing #printarea{display:block}
  #printarea .sheet{width:auto;padding:0}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
'use strict';
/* =====================================================================
   STORAGE — the only part that knows where data lives.
   GitHub contents API today; swap this object for Supabase later.
   ===================================================================== */
const CFG_KEY='events-tracker-cfg-v2';
const DEMO=new URLSearchParams(location.search).has('demo');
let cfg=Object.assign({owner:'',repo:'events-tracker-data',dir:'data',token:''},readLS(CFG_KEY));
function readLS(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}') }catch{ return {} } }
function saveCfg(){ try{ localStorage.setItem(CFG_KEY,JSON.stringify(cfg)) }catch{} }

const b64enc=s=>{ const b=new TextEncoder().encode(s); let o=''; for(let i=0;i<b.length;i+=0x8000) o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(o); };
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));

class ConflictError extends Error{}
const GitHubStore={
  sha:{},
  url(name=''){ return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.dir.replace(/^\/|\/$/g,'')}${name?'/'+name:''}`; },
  hdr(){ return {Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; },
  async list(){
    const r=await fetch(this.url(),{headers:this.hdr(),cache:'no-store'});
    if(r.status===404) return null;
    if(!r.ok) throw new Error(r.status===401?'Invalid token':`GitHub ${r.status}`);
    return (await r.json()).filter(f=>f.type==='file'&&f.name.endsWith('.json')).map(f=>f.name);
  },
  async get(name){
    const r=await fetch(this.url(name),{headers:this.hdr(),cache:'no-store'});
    if(r.status===404){ delete this.sha[name]; return null; }
    if(!r.ok) throw new Error(`GitHub ${r.status} on ${name}`);
    const j=await r.json(); this.sha[name]=j.sha; return b64dec(j.content);
  },
  async put(name,text,message,{keepalive=false}={}){
    const body={message,content:b64enc(text)};
    if(this.sha[name]) body.sha=this.sha[name];
    const json=JSON.stringify(body);
    const r=await fetch(this.url(name),{method:'PUT',headers:this.hdr(),body:json,keepalive:keepalive&&json.length<60000});
    if(r.status===409||r.status===422) throw new ConflictError(name);
    if(!r.ok) throw new Error(r.status===403?'GitHub rate limit, retry in a few minutes':`error ${r.status}`);
    this.sha[name]=(await r.json()).content.sha;
  }
};
/* ?demo — reads ../data/ next to the site folder, never writes. For local testing only. */
const DemoStore={
  async list(){ return ['config.json','clients.json','hours.json','events-2026.json']; },
  async get(name){ const r=await fetch('../data/'+name,{cache:'no-store'}); return r.ok?r.text():null; },
  async put(){ await new Promise(r=>setTimeout(r,250)); }
};
const Store=DEMO?DemoStore:GitHubStore;

/* =====================================================================
   MODEL
   ===================================================================== */
const DEFAULT_CONFIG={version:2,unit:{label:'ice creams',icon:'🍦'},
  statuses:[{name:'to prepare',color:'#8a949d'},{name:'in progress',color:'#3b6fb6'},{name:'testing',color:'#c7781b'},{name:'ready',color:'#2d8a4e'},{name:'closed',color:'#1f4e79'}],
  eventTypes:['Trail','Road running','Vertical / hill climb','Cycling','Triathlon','Multi'],startTypes:['mass','wave','individual'],checklistTemplate:[]};
/* Older data (Italian labels, plain-string lists) is upgraded in memory on load. */
const LEGACY={'da preparare':'to prepare','in corso':'in progress','in test':'testing','pronto':'ready','chiuso':'closed','in linea':'mass','a onde':'wave','individuale':'individual'};
const mkTask=(text='')=>({text,done:false,note:'',url:'',children:[]});
const toTasks=a=>(a||[]).map(x=>{ const t=typeof x==='string'?mkTask(x):{...mkTask(),...x}; t.children=(t.children||[]).map(c=>{ const k={...mkTask(),...c}; delete k.children; return k; }); return t; });
const countTasks=a=>a.reduce((n,t)=>[n[0]+1+t.children.length,n[1]+(t.done?1:0)+t.children.filter(c=>c.done).length],[0,0]);
/* Event-level lists: [key, title, placeholder, has URL] */
const SCORING_LISTS=[['rankings','Rankings','Add a ranking…',false],['teamScores','Team scores','Add a team score…',false]];
const OUTPUT_LISTS=[['lists','Lists','Add a list…',false],['myrrTabs','my.rr tabs','Add a my.rr tab…',true],['participantViews','Participant views','Add a participant view…',true],['presenter','Presenter','Add a Presenter screen…',true]];
const EVENT_LISTS=[...SCORING_LISTS,...OUTPUT_LISTS];
const TIME_BASIS={gun:'Gun time',chip:'Chip time'};
/* Rankings used to live on each race: merge them into the event, noting which races had them. */
function liftRaceLists(e){
  for(const [k] of SCORING_LISTS){
    const seen=new Map();
    for(const c of e.contests){ for(const t of toTasks(c[k])){ if(!seen.has(t.text)) seen.set(t.text,{t,races:[]}); seen.get(t.text).races.push(c.name||'untitled'); } delete c[k]; }
    for(const {t,races} of seen.values()){
      if(e[k].some(x=>x.text===t.text)) continue;
      if(e.contests.length>1&&races.length<e.contests.length) t.note=[t.note,'Only: '+races.join(', ')].filter(Boolean).join(' · ');
      e[k].push(t);
    }
  }
}
function normalize(){
  normalizeConfig();
  for(const e of S.events){
    for(const k of ['links','timingPoints','contests','questions']) e[k]=e[k]||[];
    e.checklist=e.checklist||{}; for(const [k] of EVENT_LISTS) e[k]=toTasks(e[k]);
    if(LEGACY[e.status]) e.status=LEGACY[e.status];
    if(e.myrrUrl!==undefined&&(!e.myrrUrl||e.myrrUrl===myrrUrl(e))) delete e.myrrUrl; // now derived from EventID
    e.technology=e.technology||''; e.checklistExtra=toTasks(e.checklistExtra);
    for(const t of e.timingPoints){ t.hardware=t.hardware||''; t.ch=t.ch||''; t.loop=t.loop||''; t.mode=t.mode||''; if(!t.color) t.color=nextColor(e); }
    for(const c of e.contests){ c.splits=(c.splits||[]).map(x=>({id:x.id||uid('s'),name:x.name||'',label:x.label||'',tp:x.tp||'',km:x.km??''}));
      if(LEGACY[c.startType]) c.startType=LEGACY[c.startType]; c.startType=c.startType||'mass'; c.timeBasis=c.timeBasis||''; c.date=c.date||'';
      if(c.myrrUrl){ const t=mkTask(c.name||'Race page'); t.url=c.myrrUrl; e.myrrTabs.push(t); } delete c.myrrUrl; } // per-race my.rr link → event my.rr tabs
    liftRaceLists(e);
  }
}
/* Timing hardware. tech = timing technologies it can be used with; ch/loop = allowed ID ranges (active only). */
const HW={
  'Decoder':{tech:['active','passive'],ch:[1,8],loop:[1,8],img:'decoder'},
  'Loop Box':{tech:['active'],ch:[1,8],loop:[2,8],modes:['store','repeat'],img:'loop-box'},
  'Track Box Passive':{tech:['passive'],img:'trackbox-passive'},
  'Track Box Active':{tech:['active'],ch:[1,8],img:'trackbox-active'},
  'Management Box':{tech:['active'],ch:[1,8],modes:['Tracking START','Tracking STOP','Kiosk'],notTP:true,img:'management-box'},
};
const hwImg=h=>HW[h]?.img?`img/${HW[h].img}.png`:'';
const TECH={active:{label:'Active',img:'img/active.png'},passive:{label:'Passive',img:'img/passive.png'}};
/* Ch./L. identity of a device (active only). Loop-capable devices need both, channel-only ones just Ch. */
function idKey(e,t){ const hw=HW[t.hardware]; if(e.technology==='passive'||!hw?.ch||!t.ch) return null; if(hw.loop) return t.loop?`${t.ch}/${t.loop}`:null; return `${t.ch}/–`; }
function duplicates(e){ const m={}; for(const t of e.timingPoints){ const k=idKey(e,t); if(k)(m[k]=m[k]||[]).push(t); } return Object.entries(m).filter(([,v])=>v.length>1); }
/* A Loop Box in repeat sends its reads over WiFi to the Decoder with the same Ch. and L. 1 */
const repeatTarget=(e,t)=>t.hardware==='Loop Box'&&t.mode==='repeat'?e.timingPoints.find(d=>d.hardware==='Decoder'&&String(d.ch)===String(t.ch)&&String(d.loop)==='1')||null:undefined;
const repeaters=(e,d)=>d.hardware==='Decoder'&&String(d.loop)==='1'?e.timingPoints.filter(t=>t.hardware==='Loop Box'&&t.mode==='repeat'&&String(t.ch)===String(d.ch)):[];
/* Race day: the event date for single-day events, otherwise one of the event's days */
function eventDays(e){ if(!e.dateStart||!e.dateEnd||e.dateEnd<=e.dateStart) return []; const out=[]; for(let d=new Date(e.dateStart+'T12:00');out.length<31;d.setDate(d.getDate()+1)){ const iso=d.toISOString().slice(0,10); if(iso>e.dateEnd) break; out.push(iso); } return out; }
const raceDate=(e,c)=>{ const days=eventDays(e); return days.length?(days.includes(c.date)?c.date:''):e.dateStart||''; };
const dayLabel=(e,iso)=>{ const i=eventDays(e).indexOf(iso); return i<0?'':`Day ${i+1} · ${fmtLong(iso)}`; };
const PASTEL=['#a9c9e8','#c3b5e8','#f7c9a3','#f2e198','#9fd6d6','#ebb0cc','#f2a9a4','#b9dfb0','#d9c7a7','#b3d4f0','#e3c1f0','#c8e6a0'];
const nextColor=e=>PASTEL.find(c=>!e.timingPoints.some(t=>t.color===c))||PASTEL[e.timingPoints.length%PASTEL.length];
const myrrUrl=e=>/^\d+$/.test(String(e.rr14EventId||'').trim())?`https://my.raceresult.com/${String(e.rr14EventId).trim()}/`:'';
/* RR14 identifier: upper case, letters/digits/underscore ("Start Patrimonio" → START_PATRIMONIO) */
const rrName=n=>String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'');
const splitName=(c,i)=>c.splits[i].name||(i===c.splits.length-1?'Finish':`Split${i+1}`);
const splitLabel=(e,c,i)=>{ const s=c.splits[i], t=e.timingPoints.find(x=>x.id===s.tp); return s.label||[t?.name,s.km!==''&&s.km!=null?`${s.km} km`:''].filter(Boolean).join(' · '); };

let S=null;              // {config, clients[], events[], hours:{entries[],closures[]}}
let saved={};            // file name -> last saved text
let savedItems={};       // 'e:<id>' / 'c:<id>' -> last saved JSON, for commit messages
let eventFiles=new Set();// events-YYYY.json files known in the repo

async function loadAll(){
  setState('loading…');
  const names=await Store.list();
  if(names===null) return 'missing';
  const txt={}; await Promise.all(names.map(async n=>{ txt[n]=await Store.get(n); }));
  const j=n=>txt[n]?JSON.parse(txt[n]):null;
  S={config:Object.assign({},DEFAULT_CONFIG,j('config.json')||{}),
     clients:(j('clients.json')||{}).clients||[],
     hours:Object.assign({entries:[],closures:[]},j('hours.json')||{}),
     events:[]};
  eventFiles=new Set(names.filter(n=>/^events-.+\.json$/.test(n)));
  for(const n of [...eventFiles]) S.events.push(...((j(n)||{}).events||[]));
  normalize();
  saved={}; for(const n of names) if(txt[n]!=null) saved[n]=txt[n];
  // a file that differs only in formatting doesn't count as unsaved
  for(const [n,t] of Object.entries(serialize())) if(txt[n]!=null&&JSON.stringify(JSON.parse(txt[n]))===JSON.stringify(JSON.parse(t))) saved[n]=t;
  snapshotItems(); dirty=false; setState(DEMO?'demo · not saved':'up to date');
  return 'ok';
}
function snapshotItems(){ savedItems={}; for(const e of S.events) savedItems['e:'+e.id]=JSON.stringify(e); for(const c of S.clients) savedItems['c:'+c.id]=JSON.stringify(c); }
const yearOf=e=>(e.dateStart||'').slice(0,4)||String(new Date().getFullYear());
function serialize(){
  const out={
    'config.json':JSON.stringify(S.config,null,2),
    'clients.json':JSON.stringify({version:2,clients:S.clients},null,2),
    'hours.json':JSON.stringify({version:2,entries:S.hours.entries,closures:S.hours.closures},null,2)};
  const by={}; for(const e of S.events)(by[yearOf(e)]=by[yearOf(e)]||[]).push(e);
  const files=new Set([...eventFiles,...Object.keys(by).map(y=>`events-${y}.json`)]);
  for(const f of files){ const y=f.slice(7,-5); const ev=(by[y]||[]).slice().sort((a,b)=>(a.dateStart||'9').localeCompare(b.dateStart||'9'));
    out[f]=JSON.stringify({version:2,year:+y||y,events:ev},null,2); }
  return out;
}
/* Commit message that says what changed, e.g. "Events 2026: Relais Rose, Zampata Trail" */
function changedNames(list,p){
  const ids=new Set(list.map(x=>x.id));
  const ch=list.filter(x=>savedItems[p+x.id]!==JSON.stringify(x)).map(x=>x.name||'untitled');
  const gone=Object.keys(savedItems).filter(k=>k.startsWith(p)&&!ids.has(k.slice(2))).length;
  const all=[...ch,...(gone?[`${gone} removed`]:[])];
  return (all.length>3?`${all.slice(0,3).join(', ')} +${all.length-3}`:all.join(', '))||'update';
}
function commitMessage(file){
  if(file==='hours.json') return 'Hours';
  if(file==='config.json') return 'Config';
  if(file==='clients.json') return 'Clients: '+changedNames(S.clients,'c:');
  const y=file.slice(7,-5); return `Events ${y}: `+changedNames(S.events.filter(e=>yearOf(e)===y),'e:');
}

let dirty=false,saving=false;
function touch(what){ dirty=true; setState('unsaved changes'); if(what!=='none') renderList(); }
async function save({unload=false}={}){
  if(saving||!S) return;
  if(!dirty){ setState(DEMO?'demo · not saved':'saved'); return; }
  dirty=false; saving=true; setState('saving…');
  let file=null;
  try{
    const out=serialize();
    for(const [n,t] of Object.entries(out)){
      if(saved[n]===t) continue; file=n;
      await Store.put(n,t,commitMessage(n),{keepalive:unload}); saved[n]=t; if(n.startsWith('events-')) eventFiles.add(n);
    }
    snapshotItems(); saving=false; setState(dirty?'unsaved changes':DEMO?'demo · not saved':'saved');
  }catch(err){
    saving=false; dirty=true;
    if(err instanceof ConflictError){
      setState('conflict',true);
      if(confirm(`${file} was changed elsewhere (another device or tab).\n\nOK: overwrite it with your version.\nCancel: discard your unsaved changes and reload.`)){
        await Store.get(file); return save();

/* Drag to reorder with mouse or finger: grab a .grip, the row moves live among its siblings ([data-si] children of a [data-sort] box). */
function sortable(root){
  root.querySelectorAll('.grip').forEach(g=>g.addEventListener('pointerdown',ev=>{
    const item=g.closest('[data-si]'), box=item?.parentElement; if(!box?.dataset.sort) return;
    ev.preventDefault(); g.setPointerCapture(ev.pointerId); item.classList.add('dragging'); document.body.classList.add('sorting');
    const before=[...box.children].filter(x=>x.dataset.si!==undefined).map(x=>x.dataset.si).join();
    let timer=null;
    const move=e=>{
      const y=e.clientY, sibs=[...box.children].filter(x=>x!==item&&x.dataset.si!==undefined);
      const next=sibs.find(x=>{ const r=x.getBoundingClientRect(); return y<r.top+r.height/2; });
      if(next){ if(item.nextElementSibling!==next) box.insertBefore(item,next); } else if(sibs.length&&sibs[sibs.length-1].nextElementSibling!==item) sibs[sibs.length-1].after(item);
      clearInterval(timer); const edge=y<80?-12:y>innerHeight-60?12:0; if(edge) timer=setInterval(()=>scrollBy(0,edge),16);
    };
    const up=()=>{
      clearInterval(timer); g.removeEventListener('pointermove',move); g.removeEventListener('pointerup',up); g.removeEventListener('pointercancel',up);
      item.classList.remove('dragging'); document.body.classList.remove('sorting');
      const order=[...box.children].filter(x=>x.dataset.si!==undefined).map(x=>+x.dataset.si);
      if(order.join()!==before){ const arr=OBJ[+box.dataset.sort], copy=order.map(i=>arr[i]); copy.push(...arr.filter(x=>!copy.includes(x))); arr.splice(0,arr.length,...copy); touch(); }
      renderDetail();
    };
    g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
  }));
}

function tpRow(e,t,i,dups){
  const tech=e.technology, avail=Object.keys(HW).filter(h=>!tech||HW[h].tech.includes(tech));
  const opts=[['','—'],...avail.map(h=>[h,h]),...(t.hardware&&!avail.includes(t.hardware)?[[t.hardware,`${t.hardware} (not ${tech})`]]:[])];
  const hw=HW[t.hardware], ids=tech!=='passive'&&hw, dup=dups.some(([,v])=>v.includes(t));
  // loops already taken on this channel by other loop devices
  const taken=new Set(e.timingPoints.filter(x=>x!==t&&HW[x.hardware]?.loop&&String(x.ch)===String(t.ch)&&x.ch).map(x=>String(x.loop)));
  const range=(k,[a,b])=>`<select class="idsel" data-o="${ref(t)}" data-k="${k}" data-r="detail" aria-label="${k==='ch'?'Channel ID':'Loop ID'} ${esc(t.name)}"><option value="">${k==='ch'?'Ch.':'L.'}</option>${Array.from({length:b-a+1},(_,j)=>a+j).map(n=>`<option ${String(t[k])===String(n)?'selected':''} ${k==='loop'&&taken.has(String(n))&&String(t.loop)!==String(n)?'disabled':''}>${n}</option>`).join('')}</select>`;
  const rt=repeatTarget(e,t);
  const link=rt===null?`<span class="rep bad" title="Needs a Decoder on Ch. ${esc(t.ch||'?')} / L. 1">⚠ no Decoder L. 1</span>`:rt?`<span class="rep" title="Repeats its reads over WiFi to ${esc(rt.name||'the Decoder')}">→ ${esc(rt.name||'Decoder')}</span>`:'';
  return `<tr data-si="${i}" class="${dup?'dup':''}">
    <td class="gr">${GRIP}<input type="color" class="swatch" data-o="${ref(t)}" data-k="color" value="${esc(t.color||'#cccccc')}" aria-label="Colour ${esc(t.name)}"></td>
    <td>${cell(t,'name',{ph:'Name'})}</td>
    <td><div class="hwcell">${hwImg(t.hardware)?`<img class="hwimg" src="${hwImg(t.hardware)}" alt="">`:''}<div class="hwsel"><select data-o="${ref(t)}" data-k="hardware" data-r="detail" aria-label="Hardware ${esc(t.name)}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${t.hardware===v?'selected':''}>${esc(l)}</option>`).join('')}</select>${link}</div>${t.hardware&&!avail.includes(t.hardware)?'<span class="warn" title="Not available with this technology">⚠</span>':''}</div></td>
    <td class="sm">${ids&&hw.ch?range('ch',hw.ch):''}</td>
    <td class="sm">${ids&&hw.loop?range('loop',hw.loop):''}</td>
    <td>${ids&&hw.modes?`<select data-o="${ref(t)}" data-k="mode" data-r="detail" aria-label="Mode ${esc(t.name)}"><option value="">Mode</option>${hw.modes.map(m=>`<option ${t.mode===m?'selected':''}>${m}</option>`).join('')}</select>`:''}</td>
    <td><button class="btn icon ghost pin ${t.position?'set':''}" data-pos="${ref(t)}" type="button" title="${t.position?esc('Position: '+t.position):'Set position'}" aria-label="Position of ${esc(t.name||'timing point')}"><svg viewBox="0 0 24 24" fill="${t.position?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5" fill="${t.position?'var(--panel)':'none'}"/></svg></button></td>
    <td>${cell(t,'notes',{ph:'Notes',label:'Notes'})}</td>
    <td class="x"><button class="btn sm ghost danger" data-deltp="${i}" type="button" aria-label="Remove point">×</button></td></tr>`;
}

function syncMap(){ const ll=latlon($('#pp-in').value), a=$('#pp-map'); a.href=ll?`https://www.google.com/maps?q=${ll}`:'#'; a.setAttribute('aria-disabled',ll?'false':'true'); }
function closePos(){ if(!posTarget) return; $('#pospop').hidden=true; posTarget=null; renderDetail(); }
$('#pp-in').addEventListener('input',e=>{ if(!posTarget) return; posTarget.position=e.target.value.trim(); touch('none'); syncMap(); });
$('#pp-in').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key==='Escape'){ e.preventDefault(); closePos(); } });
$('#pp-done').onclick=closePos;

document.addEventListener('pointerdown',e=>{ if(posTarget&&!e.target.closest('#pospop,[data-pos]')) closePos(); });
function download(name,text,type='text/plain'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
const latlon=p=>{ const m=String(p||'').match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/); return m?`${m[1]},${m[2]}`:''; };
/* Same line layout as an RR14 Timing Points export: NAME;9;30;#color;lat,lon;0;0;0;0;0 */
function exportTimingPoints(e){
  const tps=e.timingPoints.filter(t=>!HW[t.hardware]?.notTP), bad=tps.filter(t=>!rrName(t.name));
  if(bad.length){ alert('Every timing point needs a name.'); return; }
  const skipped=e.timingPoints.length-tps.length;
  download('Timing Points.lvs',tps.map(t=>[rrName(t.name),9,30,t.color||'',latlon(t.position),0,0,0,0,0].join(';')).join('\n')+'\n');
  if(skipped) setTimeout(()=>alert(`${plural(skipped,'Management Box was','Management Boxes were')} left out: not a timing point in RR14.`),300);
}

  <div class="stats">
    <div class="stat"><b>${ev.length}</b><span>events</span></div>
    <div class="stat"><b>${fmtN(sumH(open))}</b><span>open hours</span></div>
    <div class="stat"><b>${val(sumH(open)*coef)}</b><span>open ${esc(U().label)}</span></div>
    <div class="stat"><b>${fmtN(closedH)}</b><span>closed hours</span></div>
    <div class="stat"><b>${val(closedVal)}</b><span>closed ${esc(U().label)}</span></div>
  </div>
  <h3>Events</h3>
  ${ev.length?`<table class="t"><tbody>${ev.map(e=>`<tr><td style="width:170px">${esc(longRange(e))}</td><td><a href="#/e/${encodeURIComponent(e.id)}">${esc(e.name||'untitled')}</a></td><td><i class="dot" style="background:${esc(statusColor(e.status))}"></i>${esc(e.status)}</td><td class="num">${openQ(e).length?`<span class="qbadge">${openQ(e).length} ?</span>`:''}</td><td class="num">${fmtN(sumH(all.filter(h=>h.eventId===e.id)))} h</td></tr>`).join('')}</tbody></table>`:'<p class="hint">No events.</p>'}
  <h3>Close period</h3>
  <p class="hint" style="margin-top:0">Marks open hours up to the chosen date as closed. Today's coefficient is frozen into the closure.</p>
  <div class="closebox">
    <div class="fld"><label class="f" for="cl-until">Up to</label><input id="cl-until" type="date" value="${today()}"></div>
    <div class="fld"><label class="f" for="cl-ref">Reference</label><input id="cl-ref" placeholder="e.g. 2026-10"></div>
    <button class="btn primary" id="cl-go" type="button" ${open.length?'':'disabled'}>Close</button>
  </div>
  <p class="hint" id="cl-preview"></p>
  <h3>Closures</h3>
  ${closures.length?`<table class="t resp"><thead><tr><th>Closed on</th><th>Up to</th><th>Ref.</th><th class="num">Hours</th><th class="num">Coeff.</th><th class="num">${esc(U().icon)}</th><th></th></tr></thead><tbody>
    ${closures.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.until)}</td><td>${esc(x.ref)}</td><td class="num">${fmtN(x.hours)}</td><td class="num">${showValues?fmtN(x.coefficient):'•••'}</td><td class="num">${val(x.value)}</td><td class="x"><button class="btn sm ghost" data-reopen="${esc(x.id)}" type="button" title="Reopen these hours">Undo</button></td></tr>`).join('')}</tbody></table>`:'<p class="hint">No closures.</p>'}
  <h3>Open hours · ${fmtN(sumH(open))} h</h3>
  ${hoursTable(open.sort((a,b)=>a.date.localeCompare(b.date)),{showClient:false})}
  <div class="foot"><span>id: ${esc(c.id)}</span><button class="btn sm danger" id="delcl" type="button">Delete client</button></div>`;

  const preview=()=>{ const u=$('#cl-until').value, rows=open.filter(h=>!u||h.date<=u);
    $('#cl-preview').textContent=rows.length?`${plural(rows.length,'entry','entries')} · ${fmtN(sumH(rows))} h${showValues?` · ${fmtN(sumH(rows)*coef)} ${U().icon}`:''}`:'No open hours in this range.'; return rows; };
  preview(); $('#cl-until').oninput=preview;
  $('#cl-go').onclick=()=>{ const rows=preview(); if(!rows.length) return;
    if(!confirm(`Close ${plural(rows.length,'entry','entries')} (${fmtN(sumH(rows))} h)?`)) return;
    const h=sumH(rows), x={id:uid('cl'),clientId:c.id,date:today(),until:$('#cl-until').value,ref:$('#cl-ref').value.trim(),hours:h,coefficient:coef,value:Math.round(h*coef*100)/100,entryIds:rows.map(r=>r.id)};
    S.hours.closures.push(x); for(const r of rows) r.closure=x.id; touch(); renderDetail(); };
  on(D,'[data-reopen]',b=>{ const x=S.hours.closures.find(y=>y.id===b.dataset.reopen); if(!x||!confirm('Reopen the hours of this closure?')) return;
    for(const h of S.hours.entries) if(h.closure===x.id) h.closure=null; S.hours.closures=S.hours.closures.filter(y=>y!==x); touch(); renderDetail(); });
  D.querySelector('[data-k=coefficient]').addEventListener('change',()=>renderDetail());
  bindHoursTable(D);
  $('#delcl').onclick=()=>{ if(ev.length||all.length){ alert('This client has events or hours: move or delete them first.'); return; }
    if(confirm(`Delete the client «${c.name}»?`)){ S.clients=S.clients.filter(x=>x!==c); touch(); go('c'); } };
}

/* ---------------- HOURS view ---------------- */
const hf={client:'',state:'open',month:''};
function renderHours(D){
  const rows=S.hours.entries.filter(h=>(!hf.client||h.clientId===hf.client)&&(hf.state==='all'||(hf.state==='open')===isOpen(h))&&(!hf.month||h.date.startsWith(hf.month)))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const tot=rows.reduce((s,h)=>{ const cl=h.closure&&S.hours.closures.find(x=>x.id===h.closure); return s+num(h.hours)*(cl?cl.coefficient:num(clientOf(h.clientId)?.coefficient)); },0);
  const addC=hf.client||S.clients[0]?.id||'';
  D.innerHTML=`
  <div class="title"><h2 style="margin:0;font-size:24px">Hours</h2></div>
  <div class="hoursbar">
    <select id="hf-client" aria-label="Client"><option value="">All clients</option>${S.clients.map(c=>`<option value="${esc(c.id)}" ${hf.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <select id="hf-state" aria-label="Status">${[['open','Open'],['closed','Closed'],['all','All']].map(([v,l])=>`<option value="${v}" ${hf.state===v?'selected':''}>${l}</option>`).join('')}</select>
    <input type="month" id="hf-month" value="${hf.month}" aria-label="Month">
    <span class="hint" style="margin-left:auto"><b>${fmtN(sumH(rows))} h</b> · ${val(tot)}</span>
  </div>
  <div class="addrow wide" id="addform" style="margin:0 0 16px">
    <select id="a-client" aria-label="Client">${S.clients.map(c=>`<option value="${esc(c.id)}" ${addC===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <select id="a-event" aria-label="Event"></select>
    <input type="date" id="a-date" value="${today()}" aria-label="Date">
    <input id="a-hours" inputmode="decimal" placeholder="Hours" aria-label="Hours">
    <input id="a-note" class="grow" placeholder="What you did" aria-label="Activity">
    <button class="btn primary" id="a-add" type="button" ${S.clients.length?'':'disabled'}>Add</button>
  </div>
  ${hoursTable(rows)}`;
  const fillEv=()=>{ const cid=$('#a-client').value; $('#a-event').innerHTML=`<option value="">— general (no event) —</option>`+S.events.filter(e=>e.clientId===cid).sort((a,b)=>(b.dateStart||'').localeCompare(a.dateStart||'')).map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join(''); };
  fillEv(); $('#a-client').onchange=fillEv;
  $('#hf-client').onchange=e=>{ hf.client=e.target.value; renderDetail(); };
  $('#hf-state').onchange=e=>{ hf.state=e.target.value; renderDetail(); };
  $('#hf-month').onchange=e=>{ hf.month=e.target.value; renderDetail(); };
  $('#a-add').onclick=()=>{ const h=num($('#a-hours').value); if(!h||!$('#a-client').value) return;
    S.hours.entries.push({id:uid('h'),clientId:$('#a-client').value,eventId:$('#a-event').value||null,date:$('#a-date').value||today(),hours:h,note:$('#a-note').value.trim(),closure:null}); touch('none'); renderDetail(); };
  $('#a-note').onkeydown=ev=>{ if(ev.key==='Enter') $('#a-add').click(); };
  bindHoursTable(D);
}

/* =====================================================================
   CLIENT SUMMARY (no hours, no internal notes)
   ===================================================================== */
let sumEvent=null;
function summaryHTML(e,withResolved){
  const tpName=id=>(e.timingPoints.find(t=>t.id===id)||{}).name||'?';
  const pct=Math.round(progress(e)*100), oq=openQ(e), rq=e.questions.filter(q=>q.resolved);
  const multi=eventDays(e).length>0, anyDate=multi&&e.contests.some(c=>raceDate(e,c)), anyTime=e.contests.some(c=>c.startTime), anyEl=e.contests.some(c=>c.elevation), anyElig=e.contests.some(c=>c.eligibility);
  const sub=c=>[c.route,c.startType&&`${c.startType} start`,c.relay&&`Relay: ${c.relay}`].filter(Boolean).map(esc).join(' · ');
  const item=(t,pre='')=>`${pre}${esc(t.text)}${t.note?` <span style="color:#5a6670">— ${esc(t.note)}</span>`:''}${t.children.length?`<div style="margin:2px 0 4px 14px;font-size:13px">${t.children.map(c=>'· '+esc(c.text)+(c.note?` <span style="color:#5a6670">— ${esc(c.note)}</span>`:'')).join('<br>')}</div>`:''}`;
  const anyBasis=e.contests.some(c=>c.timeBasis);
  return `<div class="sheet">
    <h1>${esc(e.name)}</h1>
    <div class="meta">${esc(longRange(e))}${e.location?' · '+esc(e.location):''}${e.website?' · '+esc(e.website):''}</div>
    <div><span class="pill" style="background:${esc(statusColor(e.status))}">${esc(e.status)}</span><span class="prog"><i style="width:${pct}%"></i></span>${pct}% prepared${oq.length?` · <b style="color:#d9730d">${plural(oq.length,'open question','open questions')}</b>`:''}</div>
    ${oq.length?`<h2>Open questions</h2><ul class="qs">${oq.map(q=>`<li><b>Q${q.n}</b><span>${esc(q.text)}</span></li>`).join('')}</ul>`:''}
    ${e.contests.length?`<h2>Races</h2><table><thead><tr><th>Race</th>${anyDate?'<th>Day</th>':''}${anyTime?'<th>Start</th>':''}<th>Distance</th>${anyEl?'<th>Elev. gain</th>':''}${anyElig?'<th>Eligibility</th>':''}${anyBasis?'<th>Rankings by</th>':''}</tr></thead><tbody>
      ${e.contests.map(c=>`<tr><td><b>${esc(c.name)}</b>${sub(c)?`<div class="route">${sub(c)}</div>`:''}</td>${anyDate?`<td>${esc(dayLabel(e,raceDate(e,c)))}</td>`:''}${anyTime?`<td>${esc(c.startTime)}</td>`:''}<td>${c.distance?esc(c.distance)+' km':'—'}</td>${anyEl?`<td>${c.elevation?esc(c.elevation)+' m':''}</td>`:''}${anyElig?`<td>${esc(c.eligibility)}</td>`:''}${anyBasis?`<td>${esc(TIME_BASIS[c.timeBasis]||'')}</td>`:''}</tr>`).join('')}</tbody></table>`:''}
    ${e.contests.some(c=>c.splits.length)?`<h2>Timing points per race</h2>${e.contests.filter(c=>c.splits.length).map(c=>`<div><b>${esc(c.name)}</b><div class="seqline">${c.splits.map((s,i)=>`${esc(s.label||tpName(s.tp))}${!s.label&&s.km!==''&&s.km!=null?` <span style="color:#5a6670">(${esc(s.km)} km)</span>`:''}`).join(' → ')}</div></div>`).join('')}`:''}
    ${e.timingPoints.length?`<h2>Timing points${e.technology?` · ${esc(TECH[e.technology].label)} timing <img class="hw" src="${TECH[e.technology].img}" alt="">`:''}</h2><table><thead><tr><th></th><th>Timing point</th><th>Hardware</th><th>Ch. / L.</th><th>Position</th></tr></thead><tbody>${e.timingPoints.map(t=>{ const rt=repeatTarget(e,t);
      return `<tr><td style="width:34px">${hwImg(t.hardware)?`<img class="hw" src="${hwImg(t.hardware)}" alt="">`:''}</td><td><span class="sw" style="background:${esc(t.color||'#ccc')}"></span>${esc(t.name)}</td><td>${esc(t.hardware||'—')}${t.mode?` · ${esc(t.mode)}`:''}${rt?` <span class="rep">→ ${esc(rt.name)}</span>`:''}</td><td>${idKey(e,t)?esc((t.ch?'Ch. '+t.ch:'')+(t.loop&&HW[t.hardware]?.loop?' / L. '+t.loop:'')):''}</td><td>${esc(t.position)}</td></tr>`; }).join('')}</tbody></table>`:''}
    ${e.rankings.length?`<h2>Rankings</h2><div>${e.rankings.map(r=>item(r)).join('<br>')}</div>`:''}
    ${e.teamScores.length?`<h2>Team scores</h2><div>${e.teamScores.map(r=>item(r)).join('<br>')}</div>`:''}
    ${withResolved&&rq.length?`<h2>Resolved questions</h2><ul class="qs done">${rq.map(q=>`<li><b>Q${q.n}</b><span>${esc(q.text)}${q.answer?`<div class="a">→ ${esc(q.answer)}</div>`:''}</span></li>`).join('')}</ul>`:''}
    ${myrrUrl(e)?`<h2>Results</h2><div>${esc(myrrUrl(e))}</div>`:''}
    <div class="footer"><span>${esc(clientName(e.clientId))}</span><span>Updated ${esc(fmtLong(today()))}</span></div>
  </div>`;
}
function openSummary(e){ sumEvent=e; $('#sum-resolved').checked=false; $('#sumsheet').innerHTML=summaryHTML(e,false); $('#sumdlg').showModal(); }
$('#sum-resolved').onchange=ev=>{ $('#sumsheet').innerHTML=summaryHTML(sumEvent,ev.target.checked); };
$('#sum-close').onclick=()=>$('#sumdlg').close();
$('#sum-pdf').onclick=()=>{
  $('#printarea').innerHTML=summaryHTML(sumEvent,$('#sum-resolved').checked);
  $('#sumdlg').close(); document.body.classList.add('printing');
  const done=()=>{ document.body.classList.remove('printing'); $('#printarea').innerHTML=''; window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done); setTimeout(()=>window.print(),50);
};
let h2c=null;
function loadH2C(){ return h2c||(h2c=new Promise((ok,ko)=>{ const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.integrity='sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H'; s.crossOrigin='anonymous';
  s.onload=()=>ok(window.html2canvas); s.onerror=()=>{ h2c=null; ko(new Error('Could not load html2canvas')); }; document.head.appendChild(s); })); }
$('#sum-png').onclick=async()=>{
  const b=$('#sum-png'); b.disabled=true; b.textContent='Preparing…';
  try{ const html2canvas=await loadH2C(); await document.fonts?.ready;
    const canvas=await html2canvas($('#sumsheet .sheet'),{scale:2,backgroundColor:'#ffffff',logging:false});
    const a=document.createElement('a'); a.download=`summary-${slug(sumEvent.name||'event')}-${today()}.png`; a.href=canvas.toDataURL('image/png'); a.click();
  }catch(err){ alert(err.message); }
  finally{ b.disabled=false; b.textContent='Download PNG'; }
};

/* =====================================================================
   TOOLBAR, SETTINGS, BOOT
   ===================================================================== */
$('#newbtn').onclick=()=>{
  if(!S) return;
  if(route.view==='c'){ const c={id:uid('cl'),name:'',contact:'',email:'',phone:'',coefficient:1,notes:''}; S.clients.push(c); touch(); go('c',c.id); setTimeout(()=>$('#detail .name')?.focus(),0); return; }
  if(route.view==='h'){ $('#a-hours')?.focus(); return; }
  const e={id:uid('ev'),clientId:flt.client||(S.clients.length===1?S.clients[0].id:''),name:'',dateStart:'',dateEnd:'',location:'',type:'',status:S.config.statuses[0]?.name||'',website:'',rr14EventId:'',technology:'',links:[],timingPoints:[],contests:[],rankings:[],teamScores:[],lists:[],myrrTabs:[],participantViews:[],presenter:[],questions:[],checklist:{},checklistExtra:[],notes:''};
  S.events.push(e); touch(); go('e',e.id); setTimeout(()=>$('#detail .name')?.focus(),0);
};
$('#savebtn').onclick=()=>{ document.activeElement?.blur?.(); save(); };
$('#unitbtn').onclick=()=>{ showValues=!showValues; $('#unitbtn').setAttribute('aria-pressed',showValues); renderDetail(); };
$('#logoutbtn').onclick=async()=>{
  if(DEMO){ alert('Demo mode: nothing to log out from.'); return; }
  if(dirty) await save();
  if(dirty&&!confirm('Some changes could not be saved and will be lost. Log out anyway?')) return;
  cfg.token=''; saveCfg(); dirty=false; location.hash=''; location.reload();
};

const dlg=$('#settings');
function openSettings(msg=''){ $('#s-cancel').hidden=!S; $('#s-owner').value=cfg.owner; $('#s-repo').value=cfg.repo; $('#s-dir').value=cfg.dir; $('#s-token').value=cfg.token; $('#s-msg').textContent=msg; dlg.showModal(); }
$('#setbtn').onclick=()=>{ if(DEMO){ alert('Demo mode: data comes from ../data and is never saved.'); return; } openSettings(); };
$('#s-cancel').onclick=()=>dlg.close();
dlg.addEventListener('cancel',e=>{ if(!S) e.preventDefault(); }); // Esc can't dismiss the login before data is loaded
$('#loginform').onsubmit=async ev=>{ ev.preventDefault();
  cfg={owner:$('#s-owner').value.trim(),repo:$('#s-repo').value.trim(),dir:$('#s-dir').value.trim()||'data',token:$('#s-token').value.trim()};
  if(!cfg.owner||!cfg.repo||!cfg.token){ $('#s-msg').textContent='Fill in user and password.'; return; }
  try{
    let res=await loadAll();
    if(res==='missing'){
      if(!confirm(`The folder «${cfg.dir}» doesn't exist in ${cfg.owner}/${cfg.repo}. Create it with empty files?`)) return;
      S={config:structuredClone(DEFAULT_CONFIG),clients:[],events:[],hours:{entries:[],closures:[]}}; saved={}; savedItems={}; eventFiles=new Set();
      dirty=true; await save();
    }
    saveCfg(); dlg.close(); render();
  }catch(err){ $('#s-msg').textContent=err.message+'. Check user, password (token) and its permissions.'; }
};

if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

new ResizeObserver(([en])=>document.documentElement.style.setProperty('--hh',en.target.offsetHeight+'px')).observe($('header'));

(async()=>{
  parseRoute();
  if(!DEMO&&(!cfg.token||!cfg.owner)){ openSettings(); return; }
  try{ await loadAll(); render(); }catch(err){ setState(err.message,true); if(!DEMO) openSettings(err.message); }
})();
</script>
</body>
</html>
