<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Client area · Race Hub</title>
<meta name="description" content="Your events with Ulisse Mariangeli, race timing: questions, preparation, ice creams.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<link rel="manifest" href="portal.webmanifest">
<link rel="icon" href="icons/portal.svg" type="image/svg+xml">
<link rel="icon" href="icons/portal-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/portal-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Race Hub">
<style>

:root{
  --bg:#f2f2f7; --panel:#ffffff; --panel-2:#f7f7fa; --hover:rgba(120,120,128,.10); --sunken:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.20);
  --ink:#1c1c1e; --ink-2:rgba(60,60,67,.62); --ink-3:rgba(60,60,67,.40); --ink-4:rgba(60,60,67,.16);
  --line:rgba(60,60,67,.12); --line-2:rgba(60,60,67,.20); --line-3:rgba(60,60,67,.34);
  --accent:#0a7aff; --accent-hover:#0066d6; --accent-soft:rgba(10,122,255,.10); --accent-line:rgba(10,122,255,.30); --ring:rgba(10,122,255,.22);
  --ok:#34c759; --ok-soft:rgba(52,199,89,.14); --warn:#ff9500; --warn-soft:rgba(255,149,0,.14);
  --glass:rgba(242,242,247,.72);
  --shadow-sm:0 0 0 .5px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);
  --shadow-pop:0 0 0 .5px rgba(0,0,0,.06),0 14px 36px -10px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.06);
  --r:22px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#000; --panel:#1c1c1e; --panel-2:#232326; --hover:rgba(120,120,128,.20); --sunken:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.34);
  --ink:#f5f5f7; --ink-2:rgba(235,235,245,.62); --ink-3:rgba(235,235,245,.38); --ink-4:rgba(235,235,245,.16);
  --line:rgba(84,84,88,.50); --line-2:rgba(84,84,88,.70); --line-3:rgba(84,84,88,.95);
  --accent:#2f8fff; --accent-hover:#4d9fff; --accent-soft:rgba(47,143,255,.16); --accent-line:rgba(47,143,255,.40); --ring:rgba(47,143,255,.30);
  --ok:#30d158; --ok-soft:rgba(48,209,88,.16); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18);
  --glass:rgba(0,0,0,.62); --shadow-sm:0 0 0 .5px rgba(255,255,255,.06); --shadow-pop:0 0 0 .5px rgba(255,255,255,.08),0 18px 44px -10px rgba(0,0,0,.7);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000; --panel:#1c1c1e; --panel-2:#232326; --hover:rgba(120,120,128,.20); --sunken:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.34);
  --ink:#f5f5f7; --ink-2:rgba(235,235,245,.62); --ink-3:rgba(235,235,245,.38); --ink-4:rgba(235,235,245,.16);
  --line:rgba(84,84,88,.50); --line-2:rgba(84,84,88,.70); --line-3:rgba(84,84,88,.95);
  --accent:#2f8fff; --accent-hover:#4d9fff; --accent-soft:rgba(47,143,255,.16); --accent-line:rgba(47,143,255,.40); --ring:rgba(47,143,255,.30);
  --ok:#30d158; --ok-soft:rgba(48,209,88,.16); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18);
  --glass:rgba(0,0,0,.62); --shadow-sm:0 0 0 .5px rgba(255,255,255,.06); --shadow-pop:0 0 0 .5px rgba(255,255,255,.08),0 18px 44px -10px rgba(0,0,0,.7);
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",sans-serif;letter-spacing:-.006em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--round)}
svg{display:block}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;padding-top:var(--sat);background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:.5px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:var(--ink)}
.logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--panel);display:grid;place-items:center;flex:none}
.brand b{font-size:14px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{font-size:11.5px;color:var(--ink-3);display:block;line-height:1.2}
.tabs{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--sunken);margin-left:auto}
.tabs a{height:30px;padding:0 13px;border-radius:7px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink-2)}
.tabs a[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--line)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-family:var(--round)}
.ibtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--sunken);display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.ibtn:hover{background:var(--fill-2)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:0 4px 0 2px}
.who small{display:block;font-size:11px;font-weight:500;color:var(--ink-3)}

/* ---------- page ---------- */
main{max-width:1120px;margin:0 auto;padding:26px 20px 90px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
h1{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.08;margin:6px 0 4px}
.lede{font-size:15px;color:var(--ink-2);margin:0 0 22px}
.lede b{color:var(--ink);font-weight:600}
.h2{display:flex;align-items:baseline;gap:8px;font-size:20px;font-weight:800;letter-spacing:-.025em;margin:30px 4px 12px}
.h2 span{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.h2 a{margin-left:auto;font-size:13px;font-weight:500;letter-spacing:0}

.card{position:relative;isolation:isolate;overflow:hidden;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:18px}
.card.glow::before{content:'';position:absolute;inset:-30px;z-index:-1;pointer-events:none;background:radial-gradient(55% 60% at 92% 0%,color-mix(in srgb,var(--tint,var(--accent)) 24%,transparent),transparent 70%)}
.card.warn{--tint:var(--warn)}
.eye{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tint,var(--accent));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eye.mute{color:var(--ink-3)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:16px 18px;cursor:pointer;transition:transform .15s}
.stat:active{transform:scale(.985)}
.stat b{display:block;font-family:var(--round);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:8px}
.stat b small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:3px;letter-spacing:0}
.stat .sub{font-size:12px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.warn b{color:var(--warn)}
.stat .srow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat .nm{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:8px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ring */
.ringw{position:relative;flex:none;display:grid;place-items:center}
.ringw svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringw .rt{stroke:var(--line-2)} .ringw .rv{stroke:var(--tint,var(--accent));transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ringw.full .rv{stroke:var(--ok)}
.ringw b{position:relative;font-family:var(--round);font-weight:800;letter-spacing:-.02em}
.ringw b small{font-size:.62em;font-weight:700;color:var(--ink-2);margin-left:1px}

/* race day card */
.raceday{position:relative;overflow:hidden;isolation:isolate;border-radius:24px;padding:20px 22px;color:#fff;background:linear-gradient(135deg,var(--tint) 0%,var(--tint-2) 100%);box-shadow:0 18px 40px -18px var(--tint),var(--shadow-sm);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;margin-bottom:12px;cursor:pointer}
.raceday::after{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 90% at 100% 0%,rgba(255,255,255,.28),transparent 60%)}
.raceday .eye{color:rgba(255,255,255,.85);display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:#fff;animation:live 1.6s ease-out infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.raceday h3{margin:4px 0 2px;font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.raceday .meta{font-size:13.5px;opacity:.88}
.raceday .acts{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.wbtn{height:36px;padding:0 15px;border-radius:999px;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.wbtn.solid{background:#fff;color:var(--tint-2)}

/* grid helpers */
.g2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* questions */
.qev{padding:6px 0 2px}
.qev + .qev{border-top:.5px solid var(--line);margin-top:6px;padding-top:12px}
.qevh{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.qevh b{font-size:15px;font-weight:700;letter-spacing:-.015em}
.qevh small{font-size:12px;color:var(--ink-3)}
.qevh a{margin-left:auto;font-size:12.5px}
.q{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px 10px;padding:10px 0}
.q + .q{border-top:.5px solid var(--line)}
.qn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);font-family:var(--round)}
.q.done .qn{color:var(--ok);background:var(--ok-soft)}
.q.mine .qn{color:var(--accent);background:var(--accent-soft)}
.from.op{color:var(--ink-3)}
.from{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.compose{margin-top:0}
.qt{font-size:14.5px;line-height:1.4;padding-top:3px}
.qa{grid-column:2;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.field{width:100%;min-height:42px;max-height:180px;resize:vertical;border:0;border-radius:14px;background:var(--sunken);padding:11px 13px;font:inherit;font-size:14px;color:var(--ink);outline:0;transition:box-shadow .15s,background .15s}
.field:focus{background:var(--panel);box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
.qbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qa .qbar{display:none} .qa:focus-within .qbar,.qa.has .qbar{display:flex}
.qa:not(.has):not(:focus-within) .field{min-height:40px;height:40px;overflow:hidden;resize:none}
.btn{height:32px;padding:0 13px;border-radius:999px;border:0;background:var(--sunken);color:var(--ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--fill-2)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary:disabled{opacity:.35;cursor:default}
.btn.ghost{background:none;color:var(--accent);padding:0 8px}
.qbar .btn.primary{margin-left:auto}
.file{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 10px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600}
.file small{color:var(--ink-3);font-weight:500}
.file button{border:0;background:none;color:var(--ink-3);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.bubble{background:var(--accent-soft);border-radius:16px 16px 16px 6px;padding:10px 13px;font-size:14px;line-height:1.4}
.bubble small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);margin-top:5px}
.wait{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ok)}

/* events */
.evgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ev{cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px}
.ev:active{transform:scale(.985)}
.ev .top2{display:flex;gap:12px;align-items:flex-start}
.ev .nm{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin-top:3px}
.ev .loc{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.tint{background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.steps i{height:4px;border-radius:2px;background:var(--fill-2)}
.steps i.d{background:var(--tint)}
.steps i.c{background:linear-gradient(90deg,var(--tint) 50%,var(--fill-2) 50%)}
.ev .stepl{font-size:11.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;margin-top:-4px}
.ev .stepl b{color:var(--ink);font-weight:600}

/* ice cream summary card */
.ic-big{display:flex;align-items:baseline;gap:6px;margin:6px 0 2px}
.ic-big b{font-family:var(--round);font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1}
.ic-big span{font-size:26px}
.ic-sub{font-size:12.5px;color:var(--ink-2)}
.hr{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0}
.hr + .hr{border-top:.5px solid var(--line)}
.hr .d{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.15}
.hr .d b{display:block;font-family:var(--round);font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.hr .t{min-width:0}
.hr .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .t small{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .v{text-align:right;font-family:var(--round);font-weight:700;font-size:15px;white-space:nowrap}
.hr .v small{display:block;font-size:11px;font-weight:600;color:var(--ink-3);font-family:-apple-system,system-ui,sans-serif}

/* event page hero */
.back{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:500;margin:0 0 12px -2px}
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;background:var(--panel);box-shadow:var(--shadow-sm);min-height:290px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.hero::before{content:'';position:absolute;inset:-40px;background:radial-gradient(60% 50% at 70% 10%,color-mix(in srgb,var(--tint) 38%,transparent),transparent 70%);z-index:-1}
.tiles{position:absolute;top:0;right:0;bottom:0;width:62%;z-index:-2;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 45%);mask-image:linear-gradient(90deg,transparent 0%,#000 45%);opacity:.9}
.tiles img{position:absolute;width:256px;height:256px;filter:saturate(.6)}
:root[data-theme="dark"] .tiles img{filter:none}
.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--tint);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);transform:translate(-50%,-50%);animation:pin 2s ease-out infinite}
@keyframes pin{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tint) 60%,transparent),0 2px 8px rgba(0,0,0,.3)}100%{box-shadow:0 0 0 18px transparent,0 2px 8px rgba(0,0,0,.3)}}
.hero .eyebrow{color:var(--tint)}
.hero h1{font-size:44px;margin:8px 0 14px;max-width:70%}
.hfacts{display:flex;gap:8px;flex-wrap:wrap}
.fact{height:30px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 0 .5px var(--line-2);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.fact.warn{color:var(--warn);box-shadow:0 0 0 .5px var(--warn)}
.fact.tint{color:var(--tint);box-shadow:0 0 0 .5px var(--tint)}
.hero .ringw{position:absolute;top:22px;right:22px;width:84px;height:84px}
.hero .ringw b{font-size:24px}

/* progress stepper */
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:14px 0 4px;position:relative}
.st{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;position:relative;padding:0 4px}
.st::before{content:'';position:absolute;top:13px;left:-50%;right:50%;height:3px;background:var(--fill-2);z-index:0}
.st:first-child::before{display:none}
.st.d::before,.st.c::before{background:var(--tint)}
.st i{width:28px;height:28px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 2px var(--fill-2);display:grid;place-items:center;position:relative;z-index:1;color:#fff}
.st.d i{background:var(--tint);box-shadow:none}
.st.c i{box-shadow:inset 0 0 0 2px var(--tint),0 0 0 5px color-mix(in srgb,var(--tint) 18%,transparent)}
.st.c i::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--tint)}
.st > span{display:flex;flex-direction:column;gap:2px}
.st b{font-size:12.5px;font-weight:600;line-height:1.2}
.st small{font-size:11px;color:var(--ink-3);line-height:1.2}
.st.c b{color:var(--tint)}
.stnote{margin-top:14px;padding:11px 13px;border-radius:14px;background:var(--sunken);font-size:13px;color:var(--ink-2);display:flex;gap:9px;align-items:flex-start}
.stnote b{color:var(--ink)}
.stnote.warn{background:var(--warn-soft)} .stnote.warn svg{color:var(--warn)}

/* races */
.race{padding:14px 0}
.race + .race{border-top:.5px solid var(--line)}
.race-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.race-h b{font-size:16px;font-weight:700;letter-spacing:-.015em}
.race-h .tm{font-family:var(--round);font-weight:700;color:var(--tint);font-size:15px}
.race-h small{font-size:12.5px;color:var(--ink-2)}
.course{position:relative;height:66px;margin:14px 40px 0}
.course .ln{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--tint) 30%,transparent)}
.course .pt{position:absolute;top:3px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:74px}

.addline{display:flex;align-items:center;gap:8px;width:calc(100% + 36px);margin:4px -18px -18px;padding:13px 18px;border:0;border-top:.5px solid var(--line);background:none;color:var(--accent);font-size:14px;font-weight:500;text-align:left}

/* ice creams page */
.ichero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;padding:24px}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none;align-items:flex-end;justify-content:center}

.sheet{width:min(460px,100%);max-height:88vh;overflow:auto;background:var(--panel-2);border-radius:24px;padding:20px 20px calc(20px + var(--sab));box-shadow:var(--shadow-pop);animation:up .28s cubic-bezier(.2,.8,.2,1)}
:root[data-theme="dark"] .sheet{background:#1c1c1e}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.03em}
.sheet p{margin:0 0 14px;color:var(--ink-2);font-size:13.5px}

/* bottom tab bar (phone) */

/* ---------- Home (Oct 2026): built around the next event ---------- */
.tbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--sunken);display:grid;place-items:center;color:var(--ink-2);flex:none}

/* questions waiting: full width, answer in place */
.qlist{display:flex;flex-direction:column;gap:12px}
.qcard{padding:0 20px 8px}
.qhead{display:flex;align-items:center;gap:12px;margin:0 -20px 4px;padding:16px 20px 14px;border-bottom:.5px solid var(--line);background:color-mix(in srgb,var(--tint) 7%,transparent)}

/* bottom row: ice creams + contact, always the same place */
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch}

/* phone: new Home */

}


/* questions as conversations (comment style) */
.statusrow{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 22px} .statusrow .status{margin:0}

    const w=ws=new WebSocket(`${url.replace(/^http/,'ws')}/realtime/v1/websocket?apikey=${encodeURIComponent(key)}&vsn=1.0.0`);
    w.onopen=()=>{ retry=1000; send({topic:'realtime:'+tp,event:'phx_join',payload:{config:{broadcast:{self:false,ack:false},presence:{enabled:false},private:true},access_token:t},ref:String(++ref),join_ref:'1'});
      hb=setInterval(()=>send({topic:'phoenix',event:'heartbeat',payload:{},ref:String(++ref)}),25e3); };
    w.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch{ return; }
      if(m.event==='broadcast'){ const p=m.payload?.payload||{}; if(p.by&&p.by===me()) return; clearTimeout(deb); deb=setTimeout(()=>onPing(p),600); }
      else if(m.event==='phx_close'||m.event==='phx_error'||m.event==='system'&&m.payload?.status==='error') w.close(); };

  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&!ws&&!stopped){ clearTimeout(wait); wait=null; retry=1000; open(); } });

  return { stop(){ stopped=true; clearTimeout(wait); ws?.close(); }, get on(){ return ws?.readyState===1; } };
}

document.addEventListener('input',e=>{
  const t=e.target, k=t.dataset.q?t.dataset.q:t.dataset.c?'c:'+t.dataset.c:null; if(!k) return;
  drafts[k]=t.value; t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,180)+'px';
  if(t.dataset.q){ t.parentNode.classList.toggle('has',!!t.value.trim()); document.querySelectorAll(`[data-send="${CSS.escape(t.dataset.q)}"]`).forEach(b=>{ b.disabled=!t.value.trim(); b.classList.toggle('on',!!t.value.trim()); }); }
  else document.querySelectorAll(`[data-csend="${CSS.escape(t.dataset.c)}"]`).forEach(b=>b.disabled=!t.value.trim());
});
document.addEventListener('click',async e=>{
  const go=e.target.closest('[data-go]'); if(go&&!e.target.closest('[data-stop],a')){ location.hash=go.dataset.go; return; }
  const b=e.target.closest('button'); if(!b) return;
  const act=b.dataset.act;
  if(act==='account') return account();
  if(act==='update'){ e.preventDefault(); e.stopPropagation(); location.replace(location.pathname+'?v='+Date.now()+location.hash); return; } // a new URL: the Home Screen app can't serve it from its cache
  if(act==='theme') return cycleTheme();
  if(act==='arch'){ archOpen=!archOpen; return rerender(); }
  if(act==='towait') return document.getElementById('wait')?.scrollIntoView({behavior:'smooth',block:'start'});
  if(act==='signout'){ closeSheet(); return signOut(); }
  if(act==='again'){ linkSent=''; render(); return; }
  if(act==='compose'){ composing[b.dataset.id]=true; rerender(); document.querySelector(`[data-c="${CSS.escape(b.dataset.id)}"]`)?.focus(); return; }
  if(act==='uncompose'){ delete composing[b.dataset.id]; rerender(); return; }
  if(b.dataset.send){ // answer a question
    const id=b.dataset.send, text=(drafts[id]||'').trim(); if(!text) return; b.disabled=true;
    try{ await rpc('answer_question',{p_id:id,p_text:text}); delete drafts[id];
      const e2=EVENTS.find(x=>DET[x.id]?.questions.some(q=>q.id===id)); if(e2) await loadEvent(e2.id);
      toast(`Answer sent to ${OP().name.split(' ')[0]}`); rerender(); }
    catch(err){ b.disabled=false; toast(err.message||'Not sent — try again'); }
    return; }
  if(b.dataset.csend){ // ask Ulisse
    const id=b.dataset.csend, text=(drafts['c:'+id]||'').trim(); if(!text) return; b.disabled=true;
    try{ await rpc('ask_question',{p_event:id,p_text:text}); delete drafts['c:'+id]; delete composing[id]; await loadEvent(id);
      toast(`Sent to ${OP().name.split(' ')[0]}`); rerender(); }
    catch(err){ b.disabled=false; toast(err.message||'Not sent — try again'); }
    return; }
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='cf'){ e.preventDefault(); const c=$('#lcode').value.replace(/\D/g,''); if(!c) return;
    $('#cgo').disabled=true; $('#lerr').textContent='';
    try{ await verifyCode(linkSent,c); linkSent=''; state='loading'; render(); location.hash='home'; await loadAll(); }
    catch(err){ $('#cgo').disabled=false; $('#lerr').textContent=err instanceof TypeError?'No connection — try again.':err.message; }
    return; }
  if(e.target.id!=='lf') return; e.preventDefault();
  const m=$('#lmail').value.trim().toLowerCase(); if(!m) return;
  $('#lgo').disabled=true; $('#lerr').textContent='';
  try{ await sendLink(m); linkError=''; linkSent=m; render(); }
  catch(err){ $('#lgo').disabled=false; $('#lerr').textContent=err instanceof TypeError?'No connection — try again.':err.message; }
});


/* ---------- your season: map (Oct 2026, mockup/portal-map.html) ----------
   Tiles: CARTO Positron / Dark Matter with the owner's key (portal_me.cartoKey), else Esri grey. One blue dot per event (past = grey,
   behind "Show past"), only the next one says how many days are left, the selected one shows its name, touching dots merge. */
const tileSrc=(z,x,y,dark)=>ME?.cartoKey?`https://basemaps.cartocdn.com/rastertiles/${dark?'dark_all':'light_all'}/${z}/${x}/${y}@2x.png?key=${encodeURIComponent(ME.cartoKey)}`
  :`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${dark?'World_Dark_Gray_Base':'World_Light_Gray_Base'}/MapServer/tile/${z}/${y}/${x}`;
const prj=(lat,lon,z)=>{ const n=256*2**z; return [(lon+180)/360*n,(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n]; };
const cdS=e=>{ const n=days(e); return n==null?'':n===0?'Today':n===1?'Tomorrow':n<0?'done':n<14?`in ${n} d`:n<63?`in ${Math.round(n/7)} wk`:`in ${Math.round(n/30)} mo`; };
const geoUp=()=>upcoming().filter(e=>e.geo), geoPast=()=>pastEvents().filter(e=>e.geo);
function seasonCard(){
  const up=geoUp(); if(up.length<2) return ''; // one event: the Next race card already shows its map (the Map button stays at the top)
  const lats=up.map(e=>e.geo[0]), lons=up.map(e=>e.geo[1]), W=300, H=110; let z=11;
  for(;z>3;z--){ const a=prj(Math.max(...lats),Math.min(...lons),z), b=prj(Math.min(...lats),Math.max(...lons),z); if(b[0]-a[0]<=W&&b[1]-a[1]<=H) break; }
  const [cx,cy]=prj((Math.max(...lats)+Math.min(...lats))/2,(Math.max(...lons)+Math.min(...lons))/2,z), dark=isDark(); let h='';
  for(let tx=Math.floor((cx-640)/256);tx<=Math.floor((cx+640)/256);tx++) for(let ty=Math.floor((cy-100)/256);ty<=Math.floor((cy+100)/256);ty++)
    h+=`<img alt="" src="${tileSrc(z,tx,ty,dark)}" style="left:calc(50% + ${Math.round(tx*256-cx)}px);top:calc(50% + ${Math.round(ty*256-cy)+6}px)">`;
  const next=up[0];
  h+=up.map(e=>{ const [x,y]=prj(e.geo[0],e.geo[1],z); return `<span class="spt" style="left:calc(50% + ${Math.round(x-cx)}px);top:calc(50% + ${Math.round(y-cy)+6}px)">${e===next?`<b>${esc(cdS(e))}</b>`:''}</span>`; }).join('');
  return `<div class="card season" data-go="#map"><div class="cardh"><div class="eye mute">Your season</div><a class="cardlink" href="#map">Open map ›</a></div>
    <div class="ct">${plural(up.length,'race','races')} coming up</div><div class="sprev">${h}</div>
    <div class="snext">Next: <b>${esc(next.name)}</b> · ${esc(cd(days(next)))}</div></div>`;
}
function loadLeaflet(){
  if(window.L) return Promise.resolve(); if(loadLeaflet.p) return loadLeaflet.p;
  return loadLeaflet.p=new Promise((res,rej)=>{ const l=document.createElement('link'); l.rel='stylesheet'; l.href='vendor/leaflet/leaflet.css'; document.head.appendChild(l);
    const sc=document.createElement('script'); sc.src='vendor/leaflet/leaflet.js'; sc.onload=res; sc.onerror=()=>{ loadLeaflet.p=null; rej(new Error('Map failed to load')); }; document.head.appendChild(sc); });
}
let PM=null; const PMS={sel:null,past:false};
const phoneMQ=matchMedia('(max-width:640px)');
const pmEvents=()=>[...geoUp(),...(PMS.past?geoPast():[])];
const pmDate=e=>{ const d=e.start?D(e.start):null; return `<span class="pm-dbox"><b>${d?d.getDate():'–'}</b><small>${d?d.toLocaleDateString('en-GB',{weekday:'short'}):''}</small></span>`; };
const pmChips=e=>{ const past=days(e)!=null&&days(e)<0&&!upcoming().includes(e), oq=openN(e);
  return past?'<span class="chip ok">Results online</span>':`${oq?`<span class="chip warn">${plural(oq,'question','questions')} for you</span>`:'<span class="chip ok">Nothing needed</span>'}<span class="chip">${esc(cdS(e))}</span>`; };
function vMap(){
  document.body.classList.add('mapon');
  if(!PMS.sel||!pmEvents().some(e=>e.id===PMS.sel)) PMS.sel=geoUp()[0]?.id||pmEvents()[0]?.id||null;
  if(!$('#pmap')){
    $('#app').innerHTML=`<div class="pmap" id="pmap"><div id="pmapel"></div>
      <div class="pm-bar"><a class="pm-back pm-gl" href="#home">${I.chev} Home</a><button class="pm-past pm-gl" data-pm="past">Show past <span class="pm-tog"></span></button></div>
      <div class="pm-side pm-gl" id="pmside"></div><div class="pm-card pm-gl" id="pmcard"></div><div class="pm-strip" id="pmstrip"></div></div>`;
    PM=null; pmInit(); }
  else pmUpdate();
}
async function pmInit(){
  try{ await loadLeaflet(); }catch(err){ toast(err.message); return; }
  const el=$('#pmapel'); if(!el||PM) return;
  const map=L.map(el,{zoomControl:false,attributionControl:false,worldCopyJump:true});
  L.control.attribution({prefix:false,position:phoneMQ.matches?'topright':'bottomright'}).addTo(map); // phone: the card and the strip cover the bottom
  if(!phoneMQ.matches) L.control.zoom({position:'topright'}).addTo(map);
  PM={map,dark:isDark(),layer:null,pins:L.layerGroup().addTo(map)};
  pmTiles(); pmFit(); pmUpdate();
  map.on('zoomend',pmPins);
}
function pmTiles(){
  const d=isDark(); if(PM.layer&&PM.dark===d) return; PM.dark=d; PM.layer?.remove();
  PM.layer=ME?.cartoKey?L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/${d?'dark_all':'light_all'}/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(ME.cartoKey)}`,{maxZoom:20,attribution:'© OpenStreetMap © CARTO'})
    :L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${d?'World_Dark_Gray_Base':'World_Light_Gray_Base'}/MapServer/tile/{z}/{y}/{x}`,{maxZoom:16,attribution:'Tiles © Esri'});
  PM.layer.addTo(PM.map);
}
const pmPad=()=>phoneMQ.matches?{paddingTopLeft:[30,70],paddingBottomRight:[30,290]}:{paddingTopLeft:[380,50],paddingBottomRight:[60,50]};
function pmFit(){ const ev=pmEvents(); if(!ev.length){ PM.map.setView([42.1,9.1],7); return; }
  PM.map.fitBounds(L.latLngBounds(ev.map(e=>e.geo)),{...pmPad(),maxZoom:11}); }
function pmPins(){
  if(!PM) return; PM.pins.clearLayers();
  const up=geoUp(), next=up[0], wide=!phoneMQ.matches, groups=[];
  for(const e of pmEvents()){ const p=PM.map.latLngToLayerPoint(e.geo), past=!up.includes(e);
    const g=groups.find(g=>g.past===past&&g.p.distanceTo(p)<20); if(g) g.items.push(e); else groups.push({p,past,items:[e]}); }
  for(const g of groups){
    const ids=g.items.map(e=>e.id), sel=ids.includes(PMS.sel), e1=g.items.find(e=>e.id===PMS.sel)||g.items[0], more=g.items.length-1;
    const lab=sel?`${e1.name}${more?` +${more}`:''}`:ids.includes(next?.id)?(wide?`${cdS(next)} · ${next.name}`:cdS(next)):'';
    const html=`<span class="ppin ${sel?'sel':''} ${more?'cl':''} ${g.past?'past':''}">${lab?`<b>${esc(lab)}</b>`:''}${wide?`<b class="hv">${esc(g.items.map(e=>e.name).join(' · '))}</b>`:''}<i>${more?g.items.length:''}</i></span>`;
    L.marker(g.items[0].geo,{icon:L.divIcon({className:'',html,iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:sel?1000:lab?500:g.past?-100:0,keyboard:false})
      .on('click',()=>pmSelect(e1.id,false)).addTo(PM.pins);
  }
}
function pmSelect(id,fly=true){
  PMS.sel=id; pmPins(); pmUI();
  const e=pmEvents().find(x=>x.id===id); if(!e||!PM) return;
  if(fly){ const z=Math.max(PM.map.getZoom(),9), pt=PM.map.project(e.geo,z).add(phoneMQ.matches?[0,105]:[-175,0]);
    PM.map.flyTo(PM.map.unproject(pt,z),z,{duration:.6}); }
}
function pmUI(){
  const up=geoUp(), past=PMS.past?geoPast():[], e=pmEvents().find(x=>x.id===PMS.sel);
  const qc=x=>openN(x)&&upcoming().includes(x)?`<span class="pm-qc">${openN(x)}?</span>`:'';
  const card=x=>x?`<div class="t">${pmDate(x)}<div style="flex:1;min-width:0"><div class="nm">${esc(x.name)}</div><div class="lc">${esc([x.loc,x.start?fmtD(x.start,{weekday:'short',day:'numeric',month:'short'}):''].filter(Boolean).join(' · '))}</div><div class="ch">${pmChips(x)}</div></div></div>
    <div class="go"><span>${openN(x)&&upcoming().includes(x)?'Answer on the event page':'Race timing by '+esc(OP().name.split(' ')[0])}</span><a href="#e/${encodeURIComponent(x.id)}">Open event ›</a></div>`:'';
  const tog=`<button class="pm-past" data-pm="past">Show past <span class="pm-tog ${PMS.past?'on':''}"></span></button>`;
  const c=$('#pmcard'); if(c){ c.innerHTML=card(e); c.hidden=!e; }
  const st=$('#pmstrip'); if(st) st.innerHTML=[...up,...past].map(x=>`<button class="pm-sc pm-gl ${x.id===PMS.sel?'on':''} ${up.includes(x)?'':'past'}" data-pmsel="${esc(x.id)}"><div class="e"><span>${esc(cdS(x))}</span>${qc(x)}</div><b>${esc(x.name)}</b><small>${esc(x.loc||'')}</small></button>`).join('');
  const sd=$('#pmside'); if(sd){ const li=x=>`<button class="pm-li ${x.id===PMS.sel?'on':''} ${up.includes(x)?'':'past'}" data-pmsel="${esc(x.id)}">${pmDate(x)}<span class="tx"><b>${esc(x.name)}</b><small>${esc(x.loc||'')}</small></span><span class="rr">${esc(cdS(x))}${qc(x)}</span></button>`;
    sd.innerHTML=`<div class="h"><b>Your season</b>${tog}</div>
      <div class="pm-list">${up.map(li).join('')||'<div class="lede" style="padding:8px">No events with a place yet.</div>'}${past.length?`<div class="pm-lab">Past</div>${past.map(li).join('')}`:''}</div>
      ${e?`<div class="pm-sel"><div class="nm">${esc(e.name)}</div><div class="lc">${esc([e.loc,e.start?fmtD(e.start,{day:'numeric',month:'short',year:'numeric'}):''].filter(Boolean).join(' · '))}</div><div class="ch">${pmChips(e)}</div><div class="go"><span>${openN(e)&&upcoming().includes(e)?'Answer on the event page':'All set for now'}</span><a href="#e/${encodeURIComponent(e.id)}">Open event ›</a></div></div>`:''}`; }
  document.querySelectorAll('#pmap .pm-bar .pm-tog').forEach(t=>t.classList.toggle('on',PMS.past));
  $('#pmstrip .pm-sc.on')?.scrollIntoView({inline:'nearest',block:'nearest'});
}
function pmUpdate(){ if(!PM){ pmUI(); return; } pmTiles(); pmPins(); pmUI(); }
document.addEventListener('click',ev=>{
  const s=ev.target.closest('[data-pmsel]'); if(s){ pmSelect(s.dataset.pmsel); return; }
  if(ev.target.closest('[data-pm="past"]')){ PMS.past=!PMS.past; if(PM){ pmPins(); pmFit(); } pmUI(); }
});
phoneMQ.addEventListener('change',()=>{ if($('#pmap')){ PM?.map.remove(); PM=null; $('#app').innerHTML=''; vMap(); } });

/* ---------- router ---------- */
/* re-render in place: no entrance animations, and map tiles / pictures that did not change keep their already painted nodes
   (a new <img> paints empty for a frame in Safari = flash) */
function rerender(){ const y=scrollY; document.body.classList.add('still'); keepImgs(render); document.querySelectorAll('#app .rise').forEach(x=>x.classList.remove('rise')); scrollTo(0,y); setTimeout(()=>document.body.classList.remove('still'),50); } // .rise removed too: dropping .still would restart it (the flash)
function keepImgs(fn){
  const old=new Map(); for(const n of document.querySelectorAll('.htiles,.tiles,img')){ if(n.tagName==='IMG'&&n.closest('.htiles,.tiles')) continue; const k=n.outerHTML; (old.get(k)||old.set(k,[]).get(k)).push(n); }
  fn();
  for(const n of [...document.querySelectorAll('.htiles,.tiles,img')]){ if(!n.isConnected||n.tagName==='IMG'&&n.closest('.htiles,.tiles')) continue; const o=old.get(n.outerHTML)?.shift(); if(o&&o!==n) n.replaceWith(o); }
}
function render(){
  const h=decodeURIComponent(location.hash.slice(1))||'home', bare=!sess||state!=='ok';
  $('#top').style.display=$('#tbar').style.display=bare?'none':'';
  $('#app').classList.toggle('bare',bare);
  if(!sess||state==='signin'){ $('#app').innerHTML=vLogin(); return; }
  if(state==='loading'){ $('#app').innerHTML=vState('Loading…','Your events are on their way.'); return; }
  if(state==='owner'){ $('#app').innerHTML=vState('Client area','You are signed in with an account that is not a client of this area.',`<a class="btn primary" href="./" style="margin-top:14px">Open the app</a><button class="btn" data-act="signout" style="margin-top:8px">Sign out</button>`); return; }
  if(state==='error'){ $('#app').innerHTML=vState('Something went wrong',esc(loadErr),`<button class="btn primary" style="margin-top:14px" onclick="location.reload()">Try again</button>`); return; }
  if(h==='map'){ chrome('map'); vMap(); return; }
  if(PM){ PM.map.remove(); PM=null; } document.body.classList.remove('mapon');
  chrome(h.startsWith('e/')?'home':h);
  const [eid,esub]=h.startsWith('e/')?h.slice(2).split('/'):[]; if(esub==='q'){ goQ=eid; history.replaceState(null,'','#e/'+encodeURIComponent(eid)); lastHash=location.hash; }
  $('#app').innerHTML=h.startsWith('e/')?vEvent(eid):h==='q'?vQuestions():h==='ic'?vIce():vHome();
  animateRings();
  if(goQ&&$('#qs')){ const id=goQ; goQ=null; setTimeout(()=>{ const t=$('#qs .lq.turn')||$('#qs'); t.scrollIntoView({behavior:'smooth',block:'center'}); t.querySelector?.('textarea')?.focus({preventScroll:true}); },60); } // #e/<id>/q: straight to the open question
}
let goQ=null;
let lastHash=location.hash;
addEventListener('hashchange',()=>{
  if(location.hash==='#qs'){ history.replaceState(null,'',lastHash); document.getElementById('qs')?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  render(); if(location.hash!==lastHash) scrollTo(0,0); lastHash=location.hash; });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&state==='ok') loadAll(); }); // fresh data when the client comes back
if(sess) loadAll(); else { state='signin'; render(); }
</script>
